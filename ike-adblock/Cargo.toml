[package]
name = "ike-adblock"
version = "1.0.0"
edition = "2021"
description = "I.K.E. AdBlock Engine: Python module around adblock-rust for the I.K.E. browser"
license = "MPL-2.0"
publish = false

[lib]
name = "ike_adblock"
crate-type = ["cdylib"]

[dependencies]
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
