[package]
name = "ike-adblock"
version = "1.0.0"
edition = "2021"
description = "I.K.E. AdBlock Engine: Python module around adblock-rust for the I.K.E. browser"
license = "MPL-2.0"
publish = false

[lib]
name = "ike_adblock"
crate-type = ["cdylib"]

[dependencies]
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
pyo3 = { version = "0.23", features = ["abi3-py39"] }
serde_json = "1"

[features]
# "extension-module" is what the browser's module is built with (the default);
# `cargo test --no-default-features` builds the tests as a normal program.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# "unwind", not "abort": a fault inside the filter engine is caught (see
# guarded() in src/lib.rs) instead of ending the browser.
panic = "unwind"
