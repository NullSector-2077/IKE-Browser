<!doctype html>
<html><head><meta charset="utf-8"><title>I.K.E.</title>
<style>
:root{--bg:{{bg}};--fg:{{fg}};--mute:{{mute}};--card:{{card}};--line:{{line}};--acc:{{acc}}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans",sans-serif}
img.logo{display:block;width:clamp(94px,22vh,164px);height:auto;aspect-ratio:1;object-fit:contain}
h1{line-height:0;margin:8px 0 26px;padding:9px 16px;border-radius:8px;background:#081427}
h1 img{display:block;width:min(400px,calc(88vw - 32px));height:auto;aspect-ratio:1834 / 160}
.search{width:min(620px,88vw)}
form{width:100%}
.tile.add{width:92px}
input{width:100%;font:inherit;font-size:17px;padding:12px 16px;border-radius:6px;border:1px solid var(--line);
 background:var(--card);color:var(--fg);outline:none}
input::placeholder{color:var(--mute);opacity:1}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 44px;margin-top:30px;text-align:center}
.stats b{display:block;font-size:26px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--mute)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:min(1570px,96vw);margin-top:26px}
.tile{position:relative;width:92px}
.tile>a:first-child,.tile .open{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px;
 color:var(--mute);text-decoration:none;font-size:12px;border-radius:6px;cursor:pointer}
.tile .open{width:100%;background:none;border:0;font-family:inherit}
.tile>a:first-child:hover,.tile>a:first-child:focus-visible,.tile .open:hover,.tile .open:focus-visible{color:var(--fg);outline:none}
.tile .open:hover .ico,.tile .open:focus-visible .ico{border-color:var(--acc);color:var(--fg)}
.ico{position:relative;display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:8px;
 background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:20px;font-weight:600;
 transition:border-color .12s,box-shadow .14s,transform .14s}
.ico i{font-style:normal}
.ico img{position:absolute;width:28px;height:28px;inset:0;margin:auto;background:var(--card)}
.tile>a:first-child:hover .ico,.tile>a:first-child:focus-visible .ico{border-color:var(--acc)}
.name{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hide{position:absolute;top:0;right:8px;width:20px;height:20px;line-height:18px;text-align:center;border-radius:50%;
 background:var(--card);border:1px solid var(--line);color:var(--mute);text-decoration:none;font-size:14px;opacity:0}
.tile:hover .hide,.hide:focus-visible{opacity:1}
.hide:hover{color:var(--fg);border-color:var(--acc)}
/* 1.1.24: the Add tile is as visible as the Settings button: solid border, the + and the name in the text colour */
.tile.add .open{color:var(--fg)}
.tile.add .ico{font-size:26px;font-weight:400}
.tile.add input{display:none;position:absolute;top:66px;left:50%;transform:translateX(-50%);width:220px;z-index:2;
 font-size:13px;padding:7px 10px}
.tile.add.on input{display:block}
.tile.add.on .name{visibility:hidden}
/* a small touch of 1.1.3, only with "Interface effects" on: tiles lift a little under the mouse */
.fx .tile>a:first-child:hover .ico,.fx .tile>a:first-child:focus-visible .ico,.fx .tile .open:hover .ico,.fx .tile .open:focus-visible .ico{
 transform:translateY(-2px);box-shadow:0 4px 12px color-mix(in srgb,var(--fg) 16%,transparent)}
/* 1.1.9, with "Interface effects" on: the tiles come in one after the other */
@keyframes ike-tile-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fx .tile{animation:ike-tile-in .26s ease-out both}
.fx .tile:nth-child(2){animation-delay:16ms}.fx .tile:nth-child(3){animation-delay:32ms}.fx .tile:nth-child(4){animation-delay:48ms}.fx .tile:nth-child(5){animation-delay:64ms}.fx .tile:nth-child(6){animation-delay:80ms}.fx .tile:nth-child(7){animation-delay:96ms}.fx .tile:nth-child(8){animation-delay:112ms}.fx .tile:nth-child(9){animation-delay:128ms}.fx .tile:nth-child(10){animation-delay:144ms}.fx .tile:nth-child(11){animation-delay:160ms}.fx .tile:nth-child(12){animation-delay:176ms}.fx .tile:nth-child(13){animation-delay:192ms}.fx .tile:nth-child(14){animation-delay:208ms}.fx .tile:nth-child(15){animation-delay:224ms}.fx .tile:nth-child(16){animation-delay:240ms}.fx .tile:nth-child(17){animation-delay:256ms}.fx .tile:nth-child(18){animation-delay:272ms}.fx .tile:nth-child(19){animation-delay:288ms}.fx .tile:nth-child(20){animation-delay:304ms}.fx .tile:nth-child(21){animation-delay:320ms}.fx .tile:nth-child(22){animation-delay:336ms}.fx .tile:nth-child(23){animation-delay:352ms}.fx .tile:nth-child(24){animation-delay:368ms}.fx .tile:nth-child(25){animation-delay:384ms}.fx .tile:nth-child(26){animation-delay:400ms}.fx .tile:nth-child(27){animation-delay:416ms}.fx .tile:nth-child(28){animation-delay:432ms}.fx .tile:nth-child(29){animation-delay:448ms}.fx .tile:nth-child(30){animation-delay:464ms}.fx .tile:nth-child(31){animation-delay:480ms}.fx .tile:nth-child(32){animation-delay:496ms}
.fx .tile:nth-child(n+33){animation-delay:500ms}
@media (prefers-reduced-motion:reduce){.ico{transition:none}
 .fx .tile>a:first-child:hover .ico,.fx .tile .open:hover .ico,.fx .tile .open:focus-visible .ico{transform:none}
 .fx .tile{animation:none}}
.corner{position:fixed;bottom:22px;right:30px;text-align:right}
/* the two buttons of the page (1.1.7): Settings top right, the background photo bottom left */
.nt-btn{position:fixed;width:120px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px;
 color:var(--mute);text-decoration:none;font-size:12px;border-radius:6px}
.nt-btn .ico{color:var(--fg)}
.nt-btn svg{width:26px;height:26px}
.nt-btn:hover,.nt-btn:focus-visible{color:var(--fg);outline:none}
.nt-btn:hover .ico,.nt-btn:focus-visible .ico{border-color:var(--acc)}
.fx .nt-btn:hover .ico,.fx .nt-btn:focus-visible .ico{transform:translateY(-2px);
 box-shadow:0 4px 12px color-mix(in srgb,var(--fg) 16%,transparent)}
.nt-settings{top:22px;right:30px}
.nt-photo{bottom:22px;left:30px}
/* 1.1.24: the labels of the two buttons are never cut: they wrap to a second centred line when a language needs it */
.nt-btn .name{text-align:center;line-height:1.25;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
/* with a photo behind the page the logo and the name stay readable */
.photo img.logo{filter:drop-shadow(0 1px 3px rgba(0,0,0,.55))}
/* 1.1.24: over a photo every group of text sits on a soft pane in the page's colour, under a stronger
   shadow. How strong the pane is (--scrim) is worked out for each group by the script at the end from
   the photo under it, so that the text reads at 4.5:1 (the large figures at 3:1) on the worst bit of it;
   every group has its pane, always (the owner: a pane that comes and goes looks broken), a frosted glass
   that shows the photo blurred, tinted only as much as the text needs. 60% shows until the script has run. */
.glass{--scrim:60%}
.photo .nt-btn,.photo .corner,.photo .greet,.photo .tile .name,.photo .stats{
 text-shadow:0 0 2px var(--bg),0 1px 5px color-mix(in srgb,var(--bg) 80%,transparent)}
.glass .greet,.glass .corner,.glass .stats,.glass .nt-btn .name,.glass .tile .name{
 background:color-mix(in srgb,var(--bg) var(--scrim),transparent);
 -webkit-backdrop-filter:blur(16px) saturate(135%);backdrop-filter:blur(16px) saturate(135%);border-radius:10px}
.glass .greet,.glass .corner{padding:8px 14px;margin:-8px -14px}
.glass .stats{padding:8px 18px}
.glass .nt-btn .name,.glass .tile .name{padding:1px 6px}
/* 1.1.24: the greeting, top left; it stops short of the Settings button (120px wide, 30px from the right) */
.greet{position:fixed;top:26px;left:30px;max-width:max(96px,calc(100vw - 120px - 30px - 30px - 16px));
 text-align:start;overflow-wrap:anywhere}
.greet-t{font-size:24px;font-weight:300;line-height:1.2}
.greet-l{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.35}
.greet-t:empty,.greet-l:empty{display:none}
@keyframes ike-greet-in{from{opacity:0}to{opacity:1}}
.fx .greet{animation:ike-greet-in .4s ease-out both}
@media (prefers-reduced-motion:reduce){.fx .greet{animation:none}}
.clock{font-size:42px;font-weight:300;line-height:1.1;font-variant-numeric:tabular-nums}
.date{font-size:13px;color:var(--mute);margin-top:2px}
/* 1.1.24, the owner: the symbol about two centimetres. 1.1.25, the owner: symbol and text aligned as a
   tidy block. The symbol has a square box of its own and the text a box beside it, both centred on the
   same middle line; the text wraps in its own column (a long name, a long language). Fonts put a symbol
   higher or lower in its line: the page measures where the drawn symbol really is and moves it to the
   middle of its box (centreSym below), whatever the font and the zoom. In a low window (or at a large zoom)
   the symbol is at most 13 % of the window's height, so that the corner keeps clear of the page. */
.weather{font-size:15px;margin-top:10px;display:flex;align-items:center;justify-content:flex-end;gap:12px}
.weather .wsym{flex:none;display:block;min-width:1em;height:1em;font-size:min(2cm,13vh);line-height:1;text-align:center;
 white-space:nowrap}
.weather .wg{display:inline-block}
.weather .wtxt{display:block;min-width:0;max-width:min(19em,44vw);text-align:start;line-height:1.3;overflow-wrap:anywhere}
.weather:empty{display:none}
/* 1.1.25: a few details under the weather, as in Plasma's weather widget, kept simple (the owner): one
   discreet row of small symbols drawn in the text colour and their values, all on one middle line, flush
   right with the rest; the name of each value is read aloud and shown on hover */
.wx-more{display:flex;flex-wrap:nowrap;justify-content:flex-end;align-items:center;gap:12px;
 margin-top:8px;font-size:13px;line-height:1.3;color:var(--mute);font-variant-numeric:tabular-nums}
.wx-more:empty,.wx-more.wx-off{display:none}
.wx-i{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.wx-s{flex:none;width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;
 stroke-linejoin:round}
.wx-l{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);
 white-space:nowrap}
.wx-defs{position:absolute;width:0;height:0;overflow:hidden}
/* a small window (or a large zoom): the details give way, so that the corner stays clear of the page; the
   row never wraps: at the narrowest width it shows, the five details fit in one line in every language */
@media (max-height:540px),(max-width:820px){.wx-more{display:none}}
/* 1.1.10: the search engine in use, left in the search box; a click lists the engines */
.search{position:relative}
.search input{padding-left:66px}
.eng{position:absolute;left:5px;top:0;bottom:0;display:flex;align-items:center;z-index:3}
.eng-btn{display:flex;align-items:center;gap:4px;height:34px;padding:0 7px 0 8px;border:0;border-radius:4px;
 background:none;color:var(--mute);cursor:pointer;font:inherit}
.eng-btn:hover,.eng-btn:focus-visible,.eng.on .eng-btn{color:var(--fg);outline:none;
 background:color-mix(in srgb,var(--fg) 9%,transparent)}
.eng-btn::after{content:"";position:absolute;right:-3px;top:9px;bottom:9px;border-right:1px solid var(--line)}
.eng-ico{position:relative;display:inline-flex;flex:none;width:20px;height:20px}
.eng-ico svg{width:18px;height:18px;margin:1px;color:var(--mute)}
.eng-ico img{position:absolute;inset:0;width:20px;height:20px;border-radius:3px;background:var(--card)}
.eng-arrow{font-size:11px;line-height:1}
.eng-menu{display:none;position:absolute;left:-5px;top:calc(100% - 2px);min-width:250px;padding:5px;
 background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.eng.on .eng-menu{display:block}
.eng-menu a{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:4px;color:var(--fg);
 text-decoration:none;font-size:15px}
.eng-menu a:hover,.eng-menu a:focus-visible{background:color-mix(in srgb,var(--acc) 20%,transparent);outline:none}
.eng-name{flex:1;white-space:nowrap}
.eng-tick{color:var(--acc);font-weight:600;min-width:1em;text-align:right}
@keyframes ike-menu-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fx .eng.on .eng-menu{animation:ike-menu-in .14s ease-out}
@media (prefers-reduced-motion:reduce){.fx .eng.on .eng-menu{animation:none}}
</style>
<script>
// an engine's icon not known yet: the magnifier shows, and the icon is asked for once more
// a little later (I.K.E. fetches it from the engine's own site meanwhile)
function ikeIconLater(img) {
  img.style.visibility = "hidden";
  if (img.dataset.again) { img.remove(); return; }
  img.dataset.again = "1";
  setTimeout(function () { img.src = img.src + "&again=1"; }, 2500);
}
</script>{{background}}</head>
<body class="{{fx}}{{photo}}">
<div class="corner">{{corner}}</div>
<svg class="wx-defs" aria-hidden="true" focusable="false">
<symbol id="wx-feels" viewBox="0 0 16 16"><path d="M6.5 9.4V3.2a1.5 1.5 0 0 1 3 0v6.2a3 3 0 1 1-3 0z"/><path d="M8 6.2v5"/></symbol>
<symbol id="wx-wind" viewBox="0 0 16 16"><path d="M1.5 6h8.2a2 2 0 1 0-2-2"/><path d="M1.5 10h10.3a2 2 0 1 1-2 2"/><path d="M1.5 8h5"/></symbol>
<symbol id="wx-humidity" viewBox="0 0 16 16"><path d="M8 1.8S3.6 6.6 3.6 9.9a4.4 4.4 0 0 0 8.8 0C12.4 6.6 8 1.8 8 1.8z"/></symbol>
<symbol id="wx-pressure" viewBox="0 0 16 16"><path d="M2.2 12.2a6 6 0 1 1 11.6 0"/><path d="M8 11.4l2.9-3.6"/></symbol>
<symbol id="wx-rain" viewBox="0 0 16 16"><path d="M1.6 8.2a6.4 6.4 0 0 1 12.8 0z"/><path d="M8 8.2v4.6a1.5 1.5 0 0 1-3 0"/></symbol>
</svg>
{{buttons}}
{{greeting}}
<img class="logo" src="ike:logo" alt="I.K.E.">
<h1><img src="ike:wordmark" alt="Internet Kontrol Experience"></h1>
<div class="search"><form action="ike:search" method="get"><input name="q" autofocus autocomplete="off" placeholder="{{placeholder}}"></form>{{engines}}</div>
{{tiles}}
<div class="stats">{{stats}}</div>
<script>
(function () {
  var lang = "{{lang}}", clock = document.getElementById("clock"), date = document.getElementById("date");
  // with the protected time zone (1.1.24) pages see UTC: this page shows the user's own
  var zone = "{{tz}}";
  function fmt(d, opts) {
    if (zone) opts.timeZone = zone;
    try { return d.toLocaleString(lang, opts); } catch (e) { delete opts.timeZone; return d.toLocaleString(undefined, opts); }
  }
  // 1.1.23: the text is written only when it changes, and the page wakes up at
  // the next minute instead of every second (each write made a new frame: the
  // page, the window and the graphics process woke once a second for nothing)
  var wake = null, hi = null;
  // 1.1.24: the greeting (ike/resources/greeting.js); the state it keeps goes home to I.K.E. by an image request
  var greet = document.getElementById("greet");
  if (greet && window.IkeGreeting) {
    try {
      var gD = JSON.parse(document.getElementById("greet-data").textContent);
      gD.lang = lang;
      hi = IkeGreeting.create(gD, {
        title: function (t) { put(document.getElementById("greet-t"), t); },
        line: function (t) { put(document.getElementById("greet-l"), t); }
      }, function (st) { new Image().src = "ike:greet?k=" + gD.k + "&s=" + encodeURIComponent(JSON.stringify(st)); });
    } catch (e) {}
  }
  function put(el, text) { if (el && el.textContent !== text) el.textContent = text; }
  function tick() {
    var now = new Date();
    put(clock, fmt(now, {hour: "2-digit", minute: "2-digit"}));
    put(date, fmt(now, {weekday: "long", day: "numeric", month: "long"}));
    if (hi) hi.update(now);
    clearTimeout(wake);
    wake = setTimeout(tick, 60000 - now.getTime() % 60000 + 50);
  }
  if (clock || date || hi) {
    tick();
    // back in view (a tab shown again, a computer woken up): at once
    document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
  }
  // the "Add" tile: its button opens a small field for the address; Enter adds the site
  var add = document.querySelector(".tile.add");
  if (add) {
    var open = add.querySelector(".open"), field = add.querySelector("input");
    var shut = function () { add.classList.remove("on"); open.setAttribute("aria-expanded", "false"); };
    open.addEventListener("click", function () {
      add.classList.add("on");
      open.setAttribute("aria-expanded", "true");
      field.focus();
    });
    field.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { field.value = ""; shut(); open.focus(); }
    });
    field.addEventListener("blur", function () { if (!field.value.trim()) shut(); });
    add.addEventListener("submit", function (e) { if (!field.value.trim()) e.preventDefault(); });
  }
  // the engine picker of the search box (1.1.10)
  var eng = document.querySelector(".eng");
  if (eng) {
    var eb = eng.querySelector(".eng-btn"), items = eng.querySelectorAll(".eng-menu a");
    var setOpen = function (on) {
      eng.classList.toggle("on", on);
      eb.setAttribute("aria-expanded", on ? "true" : "false");
    };
    eb.addEventListener("click", function (e) {
      e.stopPropagation();
      var on = !eng.classList.contains("on");
      setOpen(on);
      if (on) { (eng.querySelector('[aria-checked="true"]') || items[0] || eb).focus(); }
    });
    document.addEventListener("click", function (e) { if (!eng.contains(e.target)) setOpen(false); });
    eng.addEventListener("keydown", function (e) {
      var list = Array.prototype.slice.call(items), at = list.indexOf(document.activeElement);
      if (e.key === "Escape" && eng.classList.contains("on")) { setOpen(false); eb.focus(); e.preventDefault(); }
      else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && eng.classList.contains("on") && list.length) {
        var n = at < 0 ? 0 : (at + (e.key === "ArrowDown" ? 1 : list.length - 1)) % list.length;
        list[n].focus();
        e.preventDefault();
      }
    });
  }
  // 1.1.25: the weather's symbol in the middle of its box by its ink. Where a font draws a symbol in
  // its line differs from font to font: the symbol is drawn once on a small canvas, in the same font,
  // to see how far its ink really reaches above and below the baseline (the font's own figures are
  // not enough: a colour emoji's picture has empty margins), a probe tells where the baseline is in
  // the page, and the symbol is moved (in em, so that the zoom keeps it) until the middle of its ink
  // is the middle of its box, beside the middle of the text
  function inkOf(text, font, size) {
    var n = Math.ceil(size * 2), base = Math.round(n * 0.7), cv = document.createElement("canvas");
    cv.width = cv.height = n;
    var c = cv.getContext("2d", {willReadFrequently: true});
    c.font = font; c.textBaseline = "alphabetic"; c.fillStyle = "#000";
    c.fillText(text, Math.round(size * 0.2), base);
    var d = c.getImageData(0, 0, n, n).data, top = -1, bottom = -1;
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        if (d[(y * n + x) * 4 + 3] > 40) { if (top < 0) top = y; bottom = y; break; }
      }
    }
    if (top < 0) { var m = c.measureText(text); return [m.actualBoundingBoxAscent, m.actualBoundingBoxDescent]; }
    return [base - top, bottom + 1 - base];
  }
  function centreSym() {
    var box = document.querySelector("#weather .wsym"), g = box && box.querySelector(".wg");
    if (!g) return;
    try {
      g.style.transform = "";
      var cs = getComputedStyle(box), size = parseFloat(cs.fontSize);
      var ink = inkOf(g.textContent, cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily, size);
      var up = ink[0], down = ink[1];
      if (!(up + down > 0) || !(size > 0)) return;
      var probe = document.createElement("i");
      probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
      box.appendChild(probe);
      var base = probe.getBoundingClientRect().top, r = box.getBoundingClientRect();
      box.removeChild(probe);
      var shift = (r.top + r.height / 2) - (base - (up - down) / 2);
      if (Math.abs(shift) < size * 0.5) g.style.transform = "translateY(" + (shift / size).toFixed(4) + "em)";
    } catch (e) {}
  }
  // 1.1.25: the details under the weather (weather.details in I.K.E.): a symbol of the page, the name
  // (read aloud, shown on hover) and the value, as text only; kinds the page does not know are left out
  var KINDS = {feels: 1, wind: 1, humidity: 1, pressure: 1, rain: 1}, SVG = "http://www.w3.org/2000/svg";
  function icon(kind) {
    var s = document.createElementNS(SVG, "svg"), u = document.createElementNS(SVG, "use");
    s.setAttribute("class", "wx-s"); s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("aria-hidden", "true");
    u.setAttribute("href", "#wx-" + kind);
    s.appendChild(u);
    return s;
  }
  function drawMore(list) {
    var box = document.getElementById("weather-more");
    if (!box) return;
    box.textContent = "";
    list = (Array.isArray(list) ? list : []).filter(function (x) {
      return x && KINDS[x.k] === 1 && typeof x.l === "string" && typeof x.v === "string";
    });
    list.forEach(function (x) {
      var it = document.createElement("span"), name = document.createElement("span"), val = document.createElement("span");
      it.className = "wx-i wx-" + x.k;
      it.title = x.l + ": " + x.v;
      it.appendChild(icon(x.k));
      name.className = "wx-l"; name.textContent = x.l;
      val.className = "wx-v"; val.textContent = x.v;
      it.appendChild(name);
      it.appendChild(document.createTextNode(" "));     // the text of the value: its name, a space, the value
      it.appendChild(val);
      box.appendChild(it);
    });
  }
  // the row gives way when the corner would run into the rest of the page (a narrow or low window):
  // the details are dropped rather than wrapped or laid over the figures
  function fitMore() {
    var box = document.getElementById("weather-more"), corner = document.querySelector(".corner");
    if (!box || !corner) return;
    box.classList.remove("wx-off");
    delete box.dataset.off;
    if (getComputedStyle(box).display === "none") return;
    var c = corner.getBoundingClientRect();
    var hit = Array.prototype.some.call(document.querySelectorAll(".stats, .tile, .search, .nt-btn"), function (e) {
      var r = e.getBoundingClientRect();
      return r.width > 0 && r.height > 0 && c.left < r.right && r.left < c.right && c.top < r.bottom && r.top < c.bottom;
    });
    if (hit) { box.classList.add("wx-off"); box.dataset.off = "crowded"; }
  }
  function settle() { centreSym(); fitMore(); }
  try {
    var wm = document.getElementById("weather-more-data");
    if (wm) drawMore(JSON.parse(wm.textContent));
  } catch (e) {}
  settle();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(settle);
  window.addEventListener("load", settle);
  window.addEventListener("resize", fitMore);
  // 1.1.24: over a photo, the pane behind each group of text (see the CSS above and newtabbg.glass_data)
  var gl = document.getElementById("glass-data");
  if (gl) try {
    var G = JSON.parse(gl.textContent), cells = G.g, gw = G.gw, gh = G.gh;
    var lumOf = function (c) {
      var f = function (v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
      return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
    };
    var ratio = function (a, b) { var x = lumOf(a), y = lumOf(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
    var mixc = function (a, b, t) { return [a[0] * (1 - t) + b[0] * t, a[1] * (1 - t) + b[1] * t, a[2] * (1 - t) + b[2] * t]; };
    var rgbOf = function (s) {
      var m = /(\d+(?:\.\d+)?)[ ,]+(\d+(?:\.\d+)?)[ ,]+(\d+(?:\.\d+)?)/.exec(s || "");
      return m ? [+m[1], +m[2], +m[3]] : null;
    };
    var hex = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    var bg = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    // each group: the box that gets the pane and its texts [selector, least ratio, colour property]
    var groups = [
      [".greet", [["#greet-t", 4.5, "color"], ["#greet-l", 4.5, "color"]]],
      [".corner", [[".clock", 4.5, "color"], [".date", 4.5, "color"], [".weather", 4.5, "color"],
                   [".wx-more", 4.5, "color"]]],
      [".stats", [[".stats b", 3, "color"], [".stats span", 4.5, "color"]]],
      [".nt-settings .name", [[".nt-settings .name", 4.5, "color"]]],
      [".nt-photo .name", [[".nt-photo .name", 4.5, "color"]]]
    ];
    var applyGlass = function () {
      var vw = innerWidth, vh = innerHeight, a = G.pw / G.ph, wd, hd;
      if (G.fit === "auto") { wd = G.pw; hd = G.ph; }
      else if ((G.fit === "cover") === (vw / vh > a)) { wd = vw; hd = vw / a; }
      else { hd = vh; wd = vh * a; }
      var ox = (vw - wd) / 2, oy = (vh - hd) / 2;
      var pane = function (box, texts) {
        var r = box.getBoundingClientRect(), pad = 10, t = 0;
        var x0 = Math.max(0, Math.floor((r.left - pad - ox) / wd * gw)), x1 = Math.min(gw - 1, Math.floor((r.right + pad - ox) / wd * gw));
        var y0 = Math.max(0, Math.floor((r.top - pad - oy) / hd * gh)), y1 = Math.min(gh - 1, Math.floor((r.bottom + pad - oy) / hd * gh));
        if (x1 >= x0 && y1 >= y0) {
          // what the blurred glass shows: the worst quarter of the photo's cells under the box (the blur
          // evens out a single bright or dark cell; 1.1.24, frosted glass instead of a flat grey pane)
          var qs = [];
          for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) qs.push(parseInt(cells.substr((y * gw + x) * 2, 2), 16));
          qs.sort(function (p, q) { return p - q; });
          var k = Math.floor((qs.length - 1) * 0.25), w = G.light ? qs[qs.length - 1 - k] : qs[k];
          var under = mixc([w, w, w], bg, G.veil / 100), cols = [];
          texts.forEach(function (x) {
            var n = typeof x[0] === "string" ? document.querySelector(x[0]) : x[0];
            var c = n && rgbOf(getComputedStyle(n)[x[2]]);
            if (c) cols.push([c, x[1]]);
          });
          for (t = 0; t <= 100; t += 2) {
            var e = mixc(under, bg, t / 100);
            if (cols.every(function (c) { return ratio(c[0], e) >= c[1]; })) break;
          }
          if (t > 100) t = 100;
        }
        box.style.setProperty("--scrim", Math.max(t, 18) + "%");   // a light tint at least: always a glass
      };
      groups.forEach(function (g) { var box = document.querySelector(g[0]); if (box) pane(box, g[1]); });
      Array.prototype.forEach.call(document.querySelectorAll(".tile .name"), function (n) {
        pane(n, [[n, 4.5, "color"]]);
      });
    };
    applyGlass();
    window.addEventListener("resize", applyGlass);
    window.addEventListener("load", applyGlass);
  } catch (e) {}
  // the weather arrives as its text, for the greeting as {k, warm} and (1.1.25) the details as a list
  window.ikeWeather = function (text, info, more) {
    var w = document.getElementById("weather");
    if (w) {
      // 1.1.24: the weather's symbol (sun, cloud...) larger, before the rest (text only, never HTML);
      // never a number taken for the symbol (weather.split_symbol in I.K.E. does the same)
      var cut = text.indexOf(" "), sym = cut > 0 ? text.slice(0, cut) : "", rest = cut > 0 ? text.slice(cut + 1) : text;
      if (!rest || /\d/.test(sym)) { sym = ""; rest = text; }
      w.textContent = "";
      if (sym) {
        var i = document.createElement("span"), g = document.createElement("span");
        i.className = "wsym"; g.className = "wg"; g.textContent = sym;
        i.appendChild(g); w.appendChild(i);
        if (rest) w.appendChild(document.createTextNode(" "));
      }
      if (rest) { var t = document.createElement("span"); t.className = "wtxt"; t.textContent = rest; w.appendChild(t); }
      centreSym();                                       // the same text as before, read aloud too
    }
    if (more !== undefined) drawMore(more);
    fitMore();
    if (info !== undefined && hi) hi.setWeather(info);
  };
})();
</script>
