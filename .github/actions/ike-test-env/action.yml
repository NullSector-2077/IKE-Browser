# The environment of the automatic tests, shared by tests.yml and autofix.yml:
# Python with the packages of the tests, Rust (the runner's own rustup, no
# third-party action), the system libraries Qt WebEngine needs without a
# display, the packaging tools, and the AdBlock engine built into vendor/adblock.
name: I.K.E. test environment
description: Python, Rust, system libraries and the AdBlock engine for the tests
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - name: Rust
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --no-self-update
        rustup default stable
        rustc --version
    - name: System libraries and packaging tools
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -yq --no-install-recommends libegl1 libgl1 libgbm1 libnss3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxshmfence1 libasound2t64 libfontconfig1 libdbus-1-3 \
            dbus libglib2.0-bin ffmpeg fonts-noto-core \
            makepkg pacman-package-manager libarchive-tools fakeroot zstd
        # the font of a Plasma desktop: the layout tests measure text widths
        mkdir -p ~/.config/fontconfig
        printf '%s\n' '<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig>' \
            '<alias binding="strong"><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>' \
            '</fontconfig>' > ~/.config/fontconfig/fonts.conf
        fc-cache -f >/dev/null
        fc-match sans-serif
        # the runner restricts the user namespaces Chromium's sandbox needs
        echo "QTWEBENGINE_DISABLE_SANDBOX=1" >> "$GITHUB_ENV"
    - name: Python packages
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check -q -r tools/test-requirements.txt pytest ruff
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ike-adblock/target
        key: adblock-${{ hashFiles('ike-adblock/Cargo.lock', 'ike-adblock/src/**') }}
    - name: AdBlock engine
      shell: bash
      run: |
        cargo build --release --locked --manifest-path ike-adblock/Cargo.toml
        install -m755 ike-adblock/target/release/libike_adblock.so vendor/adblock/ike_adblock.abi3.so
