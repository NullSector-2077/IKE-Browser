# Security checks (1.1.18, security audit of 2026-11-20), apart from "Tests".
#
# Since 2026-11-22 (the owner's decision, WP6 of the maintenance plan) a
# finding here starts an analysis and a fix on an ISOLATED branch, never on
# main (job hand-over -> autofix.yml -> tools/autofix-plan.py):
# - a RustSec advisory with a fixed version: cargo update, no AI, on
#   automation/update/security-<id> made from main; Tests and Security run
#   there, and only a failure there reaches an AI;
# - a failed sandbox or isolation test: the AI on
#   automation/update/security-sandbox(-<candidate>);
# - no fixed version upstream, or no safe fix: blocked, and the owner is told
#   (the autofix issue and the ledger issue "Maintenance ledger").
# The 1.1.18 property stays: a security finding can never make an AI change a
# protection. Every AI fix of a security finding goes through
# tools/check-autofix-patch.py --security, read from main: it refuses any line
# that names the sandbox and isolation switches or ENGINE_SAFETY
# (ike/app.py, in any file), the security tests, ike-adblock/deny.toml and any
# line naming a RustSec advisory, and stops every other assistant (exit 3).
# Nothing merges by itself: the pull request waits for the owner's order.
#
# - sandbox: the security tests with the engine's sandbox really on, as a
#   normal user (every other test runs with it off, because GitHub's runners
#   refuse the user namespaces it needs; this job allows them for its own run).
#   tests/test_sandbox.py fails if any web page process runs without the
#   seccomp filter or its own PID namespace, or if a switch took a protection
#   away; the other files run with the sandbox on too.
# - rust-advisories: the RustSec advisory database against every crate of
#   the AdBlock engine (direct and transitive, Cargo.lock), with cargo-deny
#   (the same pinned tool that checks the licences). Exceptions only in
#   ike-adblock/deny.toml, each with its reason (docs/THIRD-PARTY.md): an
#   exception without one fails the job (tools/security-fix.py check-ignores).
#   Every day it also runs on main and opens or updates the issue
#   "Rust advisories" when something is found.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"     # every day, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test environment
        uses: ./.github/actions/ike-test-env
      - name: Allow the sandbox's user namespaces (this runner only)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          test "$(id -u)" != 0
      - name: The sandbox is really on
        env:
          IKE_TEST_SANDBOX: "1"
        run: |
          unset QTWEBENGINE_DISABLE_SANDBOX QTWEBENGINE_CHROMIUM_FLAGS
          set -o pipefail
          python -m pytest -o addopts= -q -rs -p no:cacheprovider tests/test_sandbox.py 2>&1 | tee sandbox.log
          if grep -q "SKIPPED" sandbox.log; then echo "::error::the sandbox test did not run"; exit 1; fi
      - name: Security tests with the sandbox on
        env:
          IKE_TEST_SANDBOX: "1"
        run: |
          unset QTWEBENGINE_DISABLE_SANDBOX QTWEBENGINE_CHROMIUM_FLAGS
          python -m pytest -o addopts= -q -rs -p no:cacheprovider tests/test_site_isolation.py \
              tests/test_home_network.py tests/test_media_secret.py tests/test_engine_switches.py \
              tests/test_userscript_bridge.py tests/test_frame_guard.py tests/test_frame_guard_review.py \
              tests/test_referrer.py

  rust-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.22.0-${{ runner.os }}
      - name: Every exception has a reason a person wrote
        # (written to advisories.txt too: the issue below then says why the check stopped)
        run: |
          set -o pipefail
          python3 -I tools/security-fix.py check-ignores ike-adblock/deny.toml 2>&1 | tee advisories.txt
      - name: RustSec advisories (every crate of Cargo.lock)
        run: |
          if [ "$(cargo deny --version 2>/dev/null)" != "cargo-deny 0.22.0" ]; then
            cargo install --locked cargo-deny@0.22.0
          fi
          set -o pipefail
          cargo deny --manifest-path ike-adblock/Cargo.toml --locked --config ike-adblock/deny.toml \
              check advisories 2>&1 | tee advisories.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rust-advisories
          path: advisories.txt
          retention-days: 30

  # only on main (push, schedule, by hand), never on a pull request: the one
  # job that may write, and it runs no code of the repository
  advisories-issue:
    needs: rust-advisories
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-advisories
      - name: The issue "Rust advisories"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "The RustSec check found advisories for the AdBlock engine's crates"
            echo "(run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo '```'
            grep -E "^(error|warning)\[|ID:|Severity|Crate:|Version:|Title:|Solution:|Date:|deny.toml:" advisories.txt | head -200
            echo '```'
          } > body.md
          # found by its label, not by its title (anyone can open an issue
          # with that title), and the owner is named: a mail (review 2, M7)
          gh label create rust-advisories --color B60205 --description "found by security.yml" 2>/dev/null || true
          n=$(gh issue list --state open --label rust-advisories --author app/github-actions --json number --jq '.[0].number')
          sed -i "1i @$GITHUB_REPOSITORY_OWNER: serve il tuo intervento (chiedi a Claude).\n" body.md
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            gh issue create --title "Rust advisories" --label rust-advisories --assignee "$GITHUB_REPOSITORY_OWNER" \
                --body-file body.md || gh issue create --title "Rust advisories" --label rust-advisories --body-file body.md
          fi

  # The sandbox tests failed on main: one issue naming the owner (review 2 of
  # 1.1.19, H3: until then only the weekly check spoke, after two failures).
  sandbox-issue:
    needs: sandbox
    if: failure() && github.ref_name == 'main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: The issue "Sandbox tests failed"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '@%s: i test di sicurezza con la sandbox sono falliti su main (%s). Non pubblicare: chiedi a Claude.\n\nRun: %s/%s/actions/runs/%s\n' \
              "$GITHUB_REPOSITORY_OWNER" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > body.md
          gh label create sandbox-failed --color B60205 --description "found by security.yml" 2>/dev/null || true
          n=$(gh issue list --state open --label sandbox-failed --author app/github-actions --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            gh issue create --title "Sandbox tests failed on main" --label sandbox-failed \
                --assignee "$GITHUB_REPOSITORY_OWNER" --body-file body.md \
              || gh issue create --title "Sandbox tests failed on main" --label sandbox-failed --body-file body.md
          fi

  # A finding goes to the automatic fix's plan (WP6, 2026-11-22): an analysis and
  # a fix on an isolated branch automation/update/security-<id>, never on main;
  # blocked and the owner told when there is no safe fix. A dispatch, as the
  # tests hand theirs over: a run the automation started sends no
  # "workflow_run". Never for a pull request of a person (its checks say it).
  hand-over:
    needs: [sandbox, rust-advisories]
    if: >-
      failure() && github.event_name != 'pull_request' && (
      github.ref_name == 'main' || github.ref_name == 'automation/daily-maintenance' ||
      github.ref_name == 'automation/autofix-main' || startsWith(github.ref_name, 'automation/update/') ||
      startsWith(github.ref_name, 'automation/builder/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Hand the finding to the automatic fix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for pause in 15 30 0; do
            if gh workflow run autofix.yml --ref main -f run_id="$RUN_ID"; then exit 0; fi
            sleep "$pause"
          done
          exit 1

  # The sandbox tests of the automation's own branch passed (a run its token
  # started sends no "workflow_run"): the merge is asked for with a dispatch
  # (H1, H3), for an automatic fix, the daily candidate and an isolated update
  # (the verified merge, 2026-11-22). On main, after a merge made by itself:
  # the release notice, as tests.yml asks it (it needs both green).
  merge-ready:
    needs: sandbox
    if: >-
      success() && github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' &&
      (github.ref_name == 'automation/autofix-main' || github.ref_name == 'main' ||
      github.ref_name == 'automation/daily-maintenance' || startsWith(github.ref_name, 'automation/update/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Ask for the merge, or for the release notice
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          for pause in 15 30 0; do
            if [ "$REF" = main ]; then
              gh workflow run release-ready.yml --ref main && exit 0
            else
              gh workflow run automerge.yml --ref main -f sha="$SHA" && exit 0
            fi
            sleep "$pause"
          done
          exit 1
