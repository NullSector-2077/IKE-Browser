# Every day: are there newer versions of the components I.K.E. bundles?
# The answer is kept in one issue labelled "components" (opened when there is
# something new, closed when there is nothing). No repository files are changed.
# Also: did Arch Linux's own packages (qt6-webengine, python, PyQt...) change
# since the last green "Arch Linux" run on main? Then that run starts on main
# (job start-arch): compatibility to verify, not an update and not a release.
name: Daily component check

on:
  schedule:
    - cron: "17 5 * * *"     # 05:17 UTC, every day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read         # GET: the versions the last green arch.yml run on main recorded (its artifact)
      contents: read
    outputs:
      updates: ${{ steps.check.outputs.updates }}
      errors: ${{ steps.check.outputs.errors }}
      arch: ${{ steps.check.outputs.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # the token only in this step, which runs no code of others (the check
      # below builds uBlock Origin's and Dark Reader's newest sources)
      - name: The Arch versions last tested on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check-components.py --save-arch-tested arch-tested.json --repo "$GITHUB_REPOSITORY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check components
        id: check
        run: |
          python3 tools/check-components.py --json report.json --markdown report.md --arch arch-tested.json
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-report
          path: report.*
          if-no-files-found: error
          retention-days: 14

  update-issue:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Download component report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: component-report
          path: report
      - name: Update the "components" issue
        env:
          GH_TOKEN: ${{ github.token }}
          # no checkout in this job: tell gh which repository it works on
          GH_REPO: ${{ github.repository }}
          UPDATES: ${{ needs.check.outputs.updates }}
          ERRORS: ${{ needs.check.outputs.errors }}
        run: |
          gh label create components --color 1d76db \
              --description "New versions or check failures for bundled components" 2>/dev/null || true
          open=$(gh issue list --label components --state open --json number --jq '.[0].number // empty')
          if [ "$UPDATES" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
            if [ -n "$open" ]; then
              gh issue edit "$open" --body-file report/report.md
            else
              title="Component updates"
              if [ "$UPDATES" -eq 0 ]; then title="Component check needs attention"; fi
              sed -i "1i @$GITHUB_REPOSITORY_OWNER: nuove versioni o un controllo da guardare (chiedi a Claude).\n" report/report.md
              gh issue create --title "$title" --label components --assignee "$GITHUB_REPOSITORY_OWNER" \
                  --body-file report/report.md \
                || gh issue create --title "$title" --label components --body-file report/report.md
            fi
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body-file report/report.md
            gh issue close "$open"
          fi

  # Arch's packages changed since the last green "Arch Linux" run on main, or no
  # such run recorded its versions yet: that run starts on main. Its only
  # permission starts a workflow; a run already queued or running is enough.
  # A failure there goes to the automatic fix (arch.yml, hand-over).
  start-arch:
    needs: check
    if: needs.check.outputs.arch == 'changed' || needs.check.outputs.arch == 'untested'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write        # start arch.yml on main, nothing else
    steps:
      - name: Start "Arch Linux" on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          retry() { n=1; until "$@"; do [ "$n" -ge 3 ] && return 1; sleep $((n * 15)); n=$((n + 1)); done; }
          busy=$(retry gh run list --workflow arch.yml --branch main --limit 20 --json status \
                 --jq '[.[] | select(.status != "completed")] | length')
          if [ "${busy:-0}" != "0" ]; then
            echo "\"Arch Linux\" is already queued or running on main: not started again"
            exit 0
          fi
          retry gh workflow run arch.yml --ref main
          echo "Arch's packages changed: \"Arch Linux\" started on main" >> "$GITHUB_STEP_SUMMARY"
