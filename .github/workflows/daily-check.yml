# Every day: are there newer versions of the components I.K.E. bundles?
# The answer is kept in one issue labelled "components" (opened when there is
# something new, closed when there is nothing). No repository files are changed.
# Also: did Arch Linux's own packages (qt6-webengine, python, PyQt...) change
# since the last green "Arch Linux" run on main? Then that run starts on main
# (job start-arch): compatibility to verify, not an update and not a release.
# A builder of a customised component (Dark Reader, uBlock Origin's
# scriptlets) that refuses a new upstream version is a component
# incompatibility, said in the issue for a person (1.1.20). And the filter
# lists I.K.E. turns on by default are loaded into main's AdBlock engine and
# read for their scriptlets (job lists): their findings go into the issue too,
# in five classes (tools/filter-lists.py, WP8), and into the maintenance ledger
# once each; a finding an AI may analyse starts one analysis on an isolated
# branch, and AI work that found no free provider is started again (job
# ai-work, tools/ai-work.py, WP9).
name: Daily component check

on:
  schedule:
    - cron: "17 5 * * *"     # 05:17 UTC, every day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read         # GET: the versions the last green arch.yml run on main recorded (its artifact)
      contents: read
    outputs:
      updates: ${{ steps.check.outputs.updates }}
      errors: ${{ steps.check.outputs.errors }}
      refused: ${{ steps.check.outputs.refused }}
      arch: ${{ steps.check.outputs.arch }}
      arch_testing: ${{ steps.check.outputs.arch_testing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # the token only in this step, which runs no code of others (the check
      # below builds uBlock Origin's and Dark Reader's newest sources)
      - name: The Arch versions last tested on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check-components.py --save-arch-tested arch-tested.json --repo "$GITHUB_REPOSITORY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Check components
        id: check
        run: |
          python3 tools/check-components.py --json report.json --markdown report.md --arch arch-tested.json
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-report
          path: |
            report.*
            arch-tested.json
          if-no-files-found: error
          retention-days: 14

  # The filter lists I.K.E. turns on by default change every day on users'
  # computers, outside I.K.E.'s releases: downloaded as I.K.E. downloads them,
  # loaded into main's AdBlock engine and read for the scriptlets they use
  # (tools/check-components.py --filter-lists). A rule the engine cannot read
  # or a scriptlet the bundled library does not know is a finding for the
  # issue, a list that cannot be downloaded is "unreachable": neither fails
  # this job. Only main's code runs here (no code of others is built).
  lists:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      lists: ${{ steps.lists.outputs.lists }}
      findings: ${{ steps.lists.outputs.lists_findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ike-adblock/target
          key: adblock-${{ hashFiles('ike-adblock/Cargo.lock', 'ike-adblock/src/**') }}
      - name: AdBlock engine
        run: |
          cargo build --release --locked --manifest-path ike-adblock/Cargo.toml
          install -m755 ike-adblock/target/release/libike_adblock.so vendor/adblock/ike_adblock.abi3.so
      - name: The default filter lists in the engine
        id: lists
        run: |
          python3 tools/check-components.py --filter-lists lists.json --markdown lists.md
          # WP8: the findings in five classes (supported, harmless, breaking,
          # security, needs a person); the rules are written in the tool
          python3 tools/filter-lists.py classify --lists lists.json --json classes.json --markdown classes.md \
            || echo "The findings could not be classified today (see the log)." > classes.md
          cat classes.md >> lists.md
          cat lists.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filter-lists
          # every rule of every finding (lists.json) and the classes (classes.json):
          # the ledger's issue keeps only counts and three samples
          path: |
            lists.*
            classes.json
          if-no-files-found: error
          retention-days: 14

  update-issue:
    needs: [check, lists]
    # the components' report even when the lists could not be checked
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Download component report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: component-report
          path: report
      - name: Download filter lists report
        if: needs.lists.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: filter-lists
          path: lists
      - name: Update the "components" issue
        env:
          GH_TOKEN: ${{ github.token }}
          # no checkout in this job: tell gh which repository it works on
          GH_REPO: ${{ github.repository }}
          UPDATES: ${{ needs.check.outputs.updates }}
          ERRORS: ${{ needs.check.outputs.errors }}
          REFUSED: ${{ needs.check.outputs.refused }}
          FINDINGS: ${{ needs.lists.outputs.findings }}
          LISTS: ${{ needs.lists.result }}
        run: |
          REFUSED=${REFUSED:-0}
          FINDINGS=${FINDINGS:-0}
          if [ -s lists/lists.md ]; then
            cat lists/lists.md >> report/report.md
          elif [ "$LISTS" != "success" ]; then
            printf '\n### The default filter lists in the bundled engine\n\nNot checked today: the job "lists" did not finish (see the run).\n' >> report/report.md
          fi
          gh label create components --color 1d76db \
              --description "New versions or check failures for bundled components" 2>/dev/null || true
          open=$(gh issue list --label components --state open --json number,title --jq '.[0] // empty')
          number=$(printf '%s' "$open" | jq -r '.number // empty')
          current=$(printf '%s' "$open" | jq -r '.title // empty')
          # 1.1.20: a builder that refused a new upstream version comes first in the title
          if [ "$REFUSED" -gt 0 ]; then title="Component incompatibility: a builder refused a new upstream version"
          elif [ "$UPDATES" -gt 0 ]; then title="Component updates"
          elif [ "$FINDINGS" -gt 0 ]; then title="Filter lists: findings about the bundled components"
          else title="Component check needs attention"; fi
          if [ "$UPDATES" -gt 0 ] || [ "$ERRORS" -gt 0 ] || [ "$REFUSED" -gt 0 ] || [ "$FINDINGS" -gt 0 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --title "$title" --body-file report/report.md
              # editing a body notifies nobody: a new incompatibility is said with a comment
              if [ "$REFUSED" -gt 0 ] && [ "$current" != "$title" ]; then
                gh issue comment "$number" --body "@$GITHUB_REPOSITORY_OWNER: un componente non accetta più le modifiche di I.K.E. e resta alla versione in uso; serve una persona (dettagli nella descrizione, chiedi a Claude)."
              fi
            else
              sed -i "1i @$GITHUB_REPOSITORY_OWNER: nuove versioni o un controllo da guardare (chiedi a Claude).\n" report/report.md
              gh issue create --title "$title" --label components --assignee "$GITHUB_REPOSITORY_OWNER" \
                  --body-file report/report.md \
                || gh issue create --title "$title" --label components --body-file report/report.md
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body-file report/report.md
            gh issue close "$number"
          fi

  # The inventory of every external component (tools/inventory.py: found in the
  # repository itself, so a dependency added later appears with no hand edit)
  # and the maintenance ledger (tools/maintenance-ledger.py: one tracked state
  # per component update, in the issue labelled "maintenance-ledger"), 2026-11-22.
  # Only main's own code runs; the candidate's files are read, never run. The
  # token is in the steps that call GitHub, never in the inventory's step. It
  # also closes the automatic fix's reports whose failure is gone (issue #97).
  # It only reports: its failure is GitHub's or the ledger's, never an
  # automatic fix (tools/autofix-plan.py, REPORTING_JOBS).
  ledger:
    needs: [check, lists]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read         # GET: the runs of the candidate, of Arch and of the security checks
      contents: read
      issues: write         # the ledger issue; closing reports whose failure is gone
      pull-requests: read   # GET: the candidate's pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the candidate's files, only read by the inventory (never run); there may be none
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: automation/daily-maintenance
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Download component report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: component-report
          path: report
      - name: Download filter lists report
        if: needs.lists.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: filter-lists
          path: lists
      - name: GitHub's state of the candidate, of Arch and of the security checks (GET only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/maintenance-ledger.py gather --repo "$GITHUB_REPOSITORY" --out status.json \
              --advisories advisories.json
      - name: Inventory of the external components
        run: |
          python3 tools/inventory.py --json inventory.json --markdown inventory.md \
              --components report/report.json --lists lists/lists.json --arch-tested report/arch-tested.json \
              --advisories advisories.json
          if [ -f candidate/PKGBUILD ]; then
            python3 tools/inventory.py --offline --root candidate --json candidate-inventory.json > /dev/null
          fi
          cat inventory.md >> "$GITHUB_STEP_SUMMARY"
      # WP8, WP9 (tools/ai-work.py): first what the AI work of the last days
      # became (GET only) and today's filter lists, for the ledger; last, the
      # owner is told once about work that found no free provider RETRY_CAP times
      - name: The maintenance ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lists=""
          if [ -s lists/lists.json ]; then lists="--lists lists/lists.json"; fi
          python3 tools/ai-work.py gather --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --out work.json $lists
          python3 tools/maintenance-ledger.py update --repo "$GITHUB_REPOSITORY" --inventory inventory.json \
              --candidate-inventory candidate-inventory.json --report report/report.json --status status.json \
              --out ledger.md --json ledger.json --work work.json
          python3 tools/ai-work.py notify --ledger ledger.json --repo "$GITHUB_REPOSITORY" || echo "::warning::not told"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: maintenance-ledger
          path: |
            inventory.*
            candidate-inventory.json
            status.json
            advisories.json
            work.json
            ledger.*
          if-no-files-found: ignore
          retention-days: 30

  # WP8, WP9: the AI work the ledger made due today: a lists analysis
  # (automation/update/lists-<date>) or a fix that found no free provider
  # before, started again in autofix.yml. Its only permission starts a
  # workflow; it never fails the daily check (a work not started is found
  # silent by tomorrow's ledger and started again).
  ai-work:
    needs: ledger
    if: ${{ !cancelled() && needs.ledger.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write        # start autofix.yml, nothing else
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-ledger
          path: ledger
      - name: Start the AI work that is due
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ai-work.py dispatch --ledger ledger/ledger.json --repo "$GITHUB_REPOSITORY"

  # Arch's packages changed since the last green "Arch Linux" run on main, or no
  # such run recorded its versions yet: that run starts on main. Its only
  # permission starts a workflow; a run already queued or running is enough.
  # A failure there goes to the automatic fix (arch.yml, hand-over).
  start-arch:
    needs: check
    if: needs.check.outputs.arch == 'changed' || needs.check.outputs.arch == 'untested'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write        # start arch.yml on main, nothing else
    steps:
      - name: Start "Arch Linux" on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          retry() { n=1; until "$@"; do [ "$n" -ge 3 ] && return 1; sleep $((n * 15)); n=$((n + 1)); done; }
          busy=$(retry gh run list --workflow arch.yml --branch main --limit 20 --json status \
                 --jq '[.[] | select(.status != "completed")] | length')
          if [ "${busy:-0}" != "0" ]; then
            echo "\"Arch Linux\" is already queued or running on main: not started again"
            exit 0
          fi
          retry gh workflow run arch.yml --ref main
          echo "Arch's packages changed: \"Arch Linux\" started on main" >> "$GITHUB_STEP_SUMMARY"

  # AUTOMAT block 2 (2026-11-27): a package of the tested closure entered Arch's [testing] in the last day
  # (tools/check-components.py arch_testing_news): "Arch Linux (testing)" on main now, not on Wednesday only.
  start-arch-testing:
    needs: check
    if: needs.check.outputs.arch_testing == 'new'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write        # start arch-testing.yml on main, nothing else
    steps:
      - name: Start "Arch Linux (testing)" on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          retry() { n=1; until "$@"; do [ "$n" -ge 3 ] && return 1; sleep $((n * 15)); n=$((n + 1)); done; }
          busy=$(retry gh run list --workflow arch-testing.yml --branch main --limit 20 --json status \
                 --jq '[.[] | select(.status != "completed")] | length')
          if [ "${busy:-0}" != "0" ]; then
            echo "\"Arch Linux (testing)\" is already queued or running on main: not started again"
            exit 0
          fi
          retry gh workflow run arch-testing.yml --ref main
          echo "Arch [testing] has new packages of I.K.E.'s closure: \"Arch Linux (testing)\" started on main" \
            >> "$GITHUB_STEP_SUMMARY"

  # AUTOMAT (2026-11-22, nothing stays behind): every open pull request of the automation is judged
  # again once a day, and what its last verdict left for the next day is started: its checks again, or
  # the automatic fix with the reason (tools/automerge.py --daily). One round a day: nothing loops.
  # It only reads pull requests and starts workflows; it never fails the daily check.
  judge-again:
    needs: ledger
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: write        # start automerge.yml, autofix.yml and a branch's checks
      contents: read
      pull-requests: read   # the open pull requests of the automation and their last verdict
      issues: read          # (their comments)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every open pull request of the automation, again
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/automerge.py --repo "$GITHUB_REPOSITORY" --daily || echo "::warning::not judged again today"
