# The checks of the automatic fix, for the pull requests ChatGPT opens when the
# owner asks it to fix a failure (branches chatgpt/*, see docs/MAINTENANCE.md).
#
# It runs as pull_request_target, so this file and the checker always come from
# main: a pull request cannot change the rules it is checked against. Nothing of
# the pull request is ever run here; only its diff is read. The tests run on it
# as on any pull request (tests.yml).
#
# AUTOMAT part 2 (2026-11-23): the notice "DEVI AIUTARCI CON CHATGPT" asks for a pull request against
# the branch that failed: main, or a candidate's own branch (automation/...). Against a candidate the
# changes checked are still ChatGPT's own only (from where its branch leaves that candidate): the
# candidate's own update is judged by the candidate's own checks. The rules are the same ones, never
# wider (the ad blocker stays closed to ChatGPT on every branch). Against main nothing changes. A
# ChatGPT fix never merges by its checks alone: it waits for the owner's order, or, with the owner's
# repository variable AUTOMAT_CHATGPT_AUTOMERGE, it is adopted and goes through everything an AI's fix
# needs (tools/automerge.py).
name: ChatGPT fix guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  guard:
    if: startsWith(github.head_ref, 'chatgpt/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main (no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: The changes of the pull request, checked like an automatic fix
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch -q --no-tags origin "+$HEAD_SHA:refs/remotes/pr/head"
          # ChatGPT's own changes only: its branch may start from the automation's
          # branch (after two automatic attempts, with their version bump), so the
          # base is the closest of main and the automation's branches
          base=$(git merge-base origin/main refs/remotes/pr/head)
          # (a pull request against a candidate's own branch: that branch too; only a branch of the automation)
          candidate=""
          if printf '%s' "$BASE_REF" | grep -Eq '^automation/[A-Za-z0-9._/-]{1,100}$' && [ "${BASE_REF#*..}" = "$BASE_REF" ]; then
            candidate="$BASE_REF"
          fi
          for b in automation/autofix-main automation/daily-maintenance $candidate; do
            git fetch -q --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b" 2>/dev/null || continue
            mb=$(git merge-base "origin/$b" refs/remotes/pr/head) || continue
            if git merge-base --is-ancestor "$base" "$mb"; then base=$mb; fi
          done
          echo "Changes checked: $base..pull request ($(git rev-list --count "$base..refs/remotes/pr/head") commits)"
          git diff --binary "$base" refs/remotes/pr/head > "$RUNNER_TEMP/pr.patch"
          # the checker also checks that the changes apply (1.1.18): to the tree
          # they start from, main's or the automation branch's (never the PR's)
          rm -rf "$RUNNER_TEMP/pr-base"
          git worktree add -q --detach "$RUNNER_TEMP/pr-base" "$base"
          set +e
          python3 -I tools/check-autofix-patch.py --repo "$RUNNER_TEMP/pr-base" --patch "$RUNNER_TEMP/pr.patch" \
            --check-only --report "$RUNNER_TEMP/guard.md"
          verdict=$?
          set -e
          cat "$RUNNER_TEMP/guard.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" != "0" ] && [ "$verdict" != "2" ]; then    # 2: nothing changed against main
            echo "::error::the pull request goes beyond what an automatic fix may change"
            exit 1
          fi
