name: I.K.E. repository health

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "rebrand/**"]

permissions:
  contents: read

concurrency:
  group: ike-repository-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Enforce 08:00 Europe/Rome schedule
        if: github.event_name == 'schedule'
        id: local-time
        shell: bash
        run: |
          local_hour="$(TZ=Europe/Rome date +'%H')"
          echo "hour=$local_hour" >> "$GITHUB_OUTPUT"
      - name: Validate IKE Arch repository baseline
        if: github.event_name != 'schedule' || steps.local-time.outputs.hour == '08'
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s CHANGELOG.md
          test -s docs/arch/BUILDING.md
          test -s docs/arch/TESTING.md
          test -s docs/arch/MAINTENANCE.md
          test -s docs/arch/UPDATES.md
          grep -q "I.K.E." README.md
          version="$(grep '^__version__ = ' ike/__init__.py | cut -d '"' -f2)"
          test -n "$version"
          grep -q "^## $version$" CHANGELOG.md
          test -s ike/__init__.py
          test -s ike-adblock/Cargo.toml
          test -s tests/conftest.py
          test -s .github/workflows/tests.yml
          echo "IKE Arch source baseline and test workflow are present."
