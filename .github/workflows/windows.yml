# I.K.E. for Windows, on a Windows runner: the automatic tests with the real
# browser, then the installer built, installed for the current user without
# administrator questions, started, checked and uninstalled again.
#
# The installer is kept as a download of the run ("ike-browser-windows-installer",
# 30 days) for the owner's own test on a real PC (docs/WINDOWS-CHECKLIST.md).
# Nothing is published or signed here, and no key is used: the workflow can
# only read the repository.
name: Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, windows/port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Tests on Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: The runner
        shell: pwsh
        run: |
          systeminfo | Select-String "OS Name","OS Version"
          python -VV
          rustc -vV
      - name: Python packages (pinned, with hashes)
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r packaging/windows/requirements.txt
          python -m pip install pytest ruff
          python -m pip list
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ike-adblock/target
          key: adblock-windows-${{ hashFiles('ike-adblock/Cargo.lock', 'ike-adblock/src/**') }}
      - name: AdBlock engine (Rust, MSVC)
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path ike-adblock/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item ike-adblock/target/release/ike_adblock.dll vendor/adblock/ike_adblock.pyd
          python -c "import sys; sys.path.insert(0, 'vendor'); import adblock; print(adblock.BACKEND); assert adblock.MODERN"
      - name: AdBlock engine (Rust tests)
        shell: pwsh
        run: cargo test --no-default-features --locked --manifest-path ike-adblock/Cargo.toml
      - name: Lint
        shell: pwsh
        run: ruff check .
      - name: Tests
        # The engine's sandbox stays on (tests/conftest.py switches it off on
        # Linux only). Tests of things that exist on Linux only are skipped
        # by their "linux_only" marker; "-rs" lists each one with its reason.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          python -m pytest -rs --junitxml=logs/junit-tests.xml -o junit_family=xunit2 2>&1 | Tee-Object -FilePath logs/pytest.log
          exit $LASTEXITCODE
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 30

  installer:
    name: Installer on Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build tools
        shell: pwsh
        run: |
          python -VV
          rustc -vV
          $iscc = (Get-Command ISCC -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { exit 1 } }
          New-Item -ItemType Directory -Force logs | Out-Null
          # the build needs PyQt6 only to draw the icon, and pytest for the checks of the installed copy
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r packaging/windows/requirements.txt
          python -m pip install pytest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            build/windows/work/cargo-target
          key: adblock-windows-build-${{ hashFiles('ike-adblock/Cargo.lock', 'ike-adblock/src/**') }}
      - name: Build (Python embedded, wheels with hashes, engine module, launcher, installer)
        shell: pwsh
        run: |
          python packaging/windows/build.py --out build/windows 2>&1 | Tee-Object -FilePath logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/windows/build-info.json logs/
          Get-Content build/windows/build-info.json
      - name: Nothing that must not be shipped
        shell: pwsh
        run: python packaging/windows/check-install.py --tree build/windows/app
      - name: Install (silently, for the current user)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem build/windows/installer/ike-browser-*-windows-x64-setup.exe)[0].FullName
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList "/VERYSILENT","/CURRENTUSER","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$PWD\logs\install.log"
          "setup ended with $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          python packaging/windows/check-install.py --installed
      - name: Start it (--version)
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\I.K.E"
          $p = Start-Process -FilePath "$app\ike-browser.exe" -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput logs\version.txt -RedirectStandardError logs\version-err.txt
          Get-Content logs\version.txt, logs\version-err.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          $want = "I.K.E. " + (python -c "import re; print(re.search(r'__version__ = .([0-9.]+)', open('ike/__init__.py').read()).group(1))")
          if ((Get-Content logs\version.txt -Raw).Trim() -ne $want) { "expected '$want'"; exit 1 }
          # every module loads inside the installed copy (what the updater asks before it keeps an update)
          $p = Start-Process -FilePath "$app\ike-browser.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow -RedirectStandardOutput logs\selftest.txt -RedirectStandardError logs\selftest-err.txt
          Get-Content logs\selftest.txt, logs\selftest-err.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path logs\selftest.txt -Pattern "IKE-SELFTEST-OK" -Quiet)) { exit 1 }
      - name: Engine check (the installed copy, with its own Python)
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\I.K.E"
          & "$app\python\python.exe" packaging/windows/engine-check.py --app "$app" --json logs/engine.json --expect-free-only --expect-sandbox --expect-own-python
          exit $LASTEXITCODE
      - name: Tests of the installed copy
        # the same tests, started through the installed ike-browser.exe
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\I.K.E"
          $env:IKE_TEST_APP = $app
          $env:IKE_TEST_COMMAND = "$app\ike-browser.exe"
          python -m pytest -rs --junitxml=logs/junit-installed.xml -o junit_family=xunit2 2>&1 | Tee-Object -FilePath logs/pytest-installed.log
          exit $LASTEXITCODE
      - name: Uninstall (silently) and check that it is gone
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\I.K.E"
          python packaging/windows/check-install.py --make-user-data
          $p = Start-Process -FilePath "$app\unins000.exe" -Wait -PassThru -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$PWD\logs\uninstall.log"
          "uninstall ended with $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          python packaging/windows/check-install.py --uninstalled
      - name: Installer
        uses: actions/upload-artifact@v4
        with:
          name: ike-browser-windows-installer
          path: |
            build/windows/installer/ike-browser-*-windows-x64-setup.exe
            build/windows/build-info.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 30
