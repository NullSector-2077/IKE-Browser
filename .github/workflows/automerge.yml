# A green fix of the automation or of ChatGPT goes into main by itself (1.1.19,
# the owner's decision): only when it changes no test and no protected file and
# every check of its last commit passed (tools/automerge.py, read from main:
# a pull request never brings the rules it is judged by). Anything else waits
# for a person. The owner only signs and publishes (release-ready.yml mails).
name: Merge green fixes

on:
  workflow_run:
    workflows: ["Tests", "Security", "ChatGPT fix guard", "Arch Linux"]
    types: [completed]

permissions: {}

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write          # the merge
      pull-requests: write     # ready for review, the comment
      actions: write           # the tests of main after the merge
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Merge it when every rule holds
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 -I tools/automerge.py --repo "${{ github.repository }}" --sha "$SHA"
