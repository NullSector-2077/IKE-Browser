# The verified merge (2026-11-22, the owner's decision): the automation's own
# pull request (the daily maintenance candidate automation/daily-maintenance,
# an AutoFix fix automation/autofix-main or automation/update/...) goes into
# main by itself only when it is FULLY VERIFIED: every check of its last commit
# passed (tests, sandbox, Security, Arch Linux), every category of
# tools/test-categories.py its components need was run and passed with no
# required test skipped, no test file changed or removed, no protected file or
# workflow touched, the licences up to date and no security finding open.
# Then the tests of main run and release-ready.yml tells the owner a version
# is ready to sign; signing and publishing stay with the owner.
# The rules are tools/automerge.py read from main, never from the pull
# request: no agent merges its own work. Anything short of fully verified
# waits, with one comment naming the owner (and the ledger says why). A fix of
# ChatGPT is only marked ready, and a person's pull request is not touched:
# both wait for the owner's order (CLAUDE.md).
#
# Runs the automation started with its own token send no "workflow_run": the
# Tests, Security and Arch Linux runs of its branches start this one with a
# dispatch when they pass (job merge-ready; review 2 of 1.1.19, H1).
#
# Everything automatic and verified converges into main (2026-11-22, the
# owner's decision): several verified merges go into the same unpublished
# version (a second raise on top waits for a person); a verified candidate
# behind main is refreshed first (main merged into its own branch, CHANGELOG
# and version files resolved as decided, any other conflict left for a person;
# pushed with this job's token to that branch only, never to main) and its
# Tests, Security and Arch Linux start again; after every merge the other
# open pull requests of the automation are judged again (a dispatch each).
#
# AUTOMAT, the full automation (2026-11-22, the owner's decision: the only human step is the
# signature): a pull request with a commit an AI wrote also needs the static guard
# (tools/fix-guard.py), "Nothing gets worse" (no-regression) and two independent AI reviewers that
# approved this very commit (ai-review.yml, started from here once everything else holds; its status
# "ai-review" and its comment are read back). Nothing waits for a person: what is not merged gets one
# informational comment and is tried again (the automatic fix with the reason, a rebuild from main,
# main merged in with the conflicts as main's; the daily check judges every open one again). Only an
# open security finding still blocks and names the owner.
#
# The merged head branch is deleted right after the merge (2026-11-24; GitHub's own setting does not
# fire for a merge by github-actions[bot]): only an isolated candidate (automation/update/<id>,
# automation/builder/<id>) whose tip is still the merged commit; automation/autofix-main,
# automation/daily-maintenance, automat/memory and everything else stay (tools/branch-sweep.py, which
# also sweeps the rest once a week: branch-sweep.yml).
name: Merge green fixes

on:
  workflow_run:
    workflows: ["Tests", "Security", "ChatGPT fix guard", "Arch Linux"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "last commit of the pull request"
        required: true

permissions: {}

# one queue per commit: a later run for another commit never replaces the
# deciding run of this one (review 2 of 1.1.19, M8)
concurrency:
  group: automerge-${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    permissions:
      contents: write          # the merge of a fully verified pull request of the automation; its refresh (its own branch); its head branch deleted after the merge
      pull-requests: write     # ready for review, the one comment
      issues: read             # its own earlier comment, the security issues, the maintenance ledger
      actions: write           # the runs and test results of the commit; Arch on it; main's tests after the merge; the others judged again
      checks: read             # the checks of the commit
      statuses: read           # the status "ai-review" of the two independent AI reviewers (ai-review.yml)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0           # the refresh merges main into the candidate (git merge-tree)
          persist-credentials: false
      - name: Merge it when it is fully verified
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}
          # the owner's token, empty when the owner set none: the merge of the CI pins' candidate, already
          # verified line by line (tools/ci-pins.py; GitHub refuses workflow changes to the workflow's own
          # token), and the push of a refresh (its push runs the pull request's own checks, which a push
          # of the workflow's token leaves waiting for an approval)
          IKE_WORKFLOW_TOKEN: ${{ secrets.IKE_WORKFLOW_TOKEN }}
          # AUTOMAT part 2: the owner's two switches. Repository variables: only the owner sets them, in
          # GitHub's settings; no file of the repository and no workflow can. Anything but "on" is off.
          #   AUTOMAT_TIER_B             a few tier-B files open to the AIs in their narrowest form (tools/tier-b.py)
          #   AUTOMAT_CHATGPT_AUTOMERGE  a verified ChatGPT fix is adopted into AUTOMAT's chain (adoptable)
          AUTOMAT_TIER_B: ${{ vars.AUTOMAT_TIER_B }}
          AUTOMAT_CHATGPT_AUTOMERGE: ${{ vars.AUTOMAT_CHATGPT_AUTOMERGE }}
        run: python3 -I tools/automerge.py --repo "${{ github.repository }}" --sha "$SHA"

  # AUTOMAT's memory (tools/automat-memory.py, the data branch automat/memory): the fix that was merged
  # solved its error; a later error with the same signature gets it as a hint. Since 2026-11-24 also: any
  # merge of the automation ends its branch's row of failures, and a pull request that was closed after its
  # row's last failure marks the row closed (never deleted: the count of failures in a row stays; never a
  # long-lived branch such as automation/autofix-main), so that the priority of the free quotas does not wait
  # for work that is over (read with GET calls: tools/ai-quota.py pending). In the same queue as the automatic
  # fix's own record (automat-memory); when the data branch moved meanwhile the record is made again from its
  # newest commit, a few times, and a record that could not be written is a visible warning. No AI here.
  memory:
    needs: merge
    if: always() && needs.merge.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    concurrency:
      group: automat-memory
      cancel-in-progress: false
    permissions:
      contents: write          # the data branch automat/memory only (never main)
      pull-requests: read      # the closed pull requests (GET)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: AUTOMAT's memory of the fix that was merged
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ needs.merge.outputs.merged }}
        run: |
          case "$COMPONENT" in automation/*|"") ;; *) exit 0 ;; esac
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          remote="https://github.com/$GITHUB_REPOSITORY"
          data="$RUNNER_TEMP/memory-branch"
          # one record, made from the newest commit of the data branch; 0 written or nothing to write, 1 not
          # pushed (the branch moved meanwhile: made again), 2 the branch could not be read
          record() {
            cd "$GITHUB_WORKSPACE"
            rm -rf "$data"
            git init -q "$data"
            cd "$data"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch -q --depth 1 "$remote" refs/heads/automat/memory 2> /dev/null || return 2
            git checkout -q -B data FETCH_HEAD
            if [ -n "$COMPONENT" ]; then
              python3 -I "$GITHUB_WORKSPACE/tools/automat-memory.py" merged --memory memory.json --component "$COMPONENT"
            fi
            if python3 -I "$GITHUB_WORKSPACE/tools/ai-quota.py" pending --repo "$GITHUB_REPOSITORY" --memory memory.json \
                 --no-runs --out "$RUNNER_TEMP/pending.json"; then
              python3 -I "$GITHUB_WORKSPACE/tools/automat-memory.py" closed --memory memory.json --closed "$RUNNER_TEMP/pending.json"
            fi
            git add memory.json
            git -c core.hooksPath=/dev/null commit -q -m "AUTOMAT's memory: ${COMPONENT:-closed pull requests} merged or closed" || return 0
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push -q "$remote" HEAD:refs/heads/automat/memory || return 1
          }
          for attempt in 1 2 3 4 5; do
            code=0
            record || code=$?
            if [ "$code" = 0 ]; then exit 0; fi
            if [ "$code" = 2 ]; then
              echo "::warning title=AUTOMAT's memory::the data branch automat/memory could not be read: ${COMPONENT:-the closed pull requests} not recorded"
              exit 0
            fi
            echo "the data branch moved meanwhile (attempt $attempt): made again from its newest commit"
            sleep $((attempt * 5 + RANDOM % 7))
          done
          echo "::warning title=AUTOMAT's memory::not written after 5 attempts: ${COMPONENT:-the closed pull requests} not recorded on automat/memory"
