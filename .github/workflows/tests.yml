# On every pull request to main and every push to main: lint, the automatic
# tests (docs/TESTING.md) with the real browser without a display, then the
# Arch package built from the PKGBUILD and tested as installed. The package is
# kept as a download of the run ("ike-browser-package").
name: Tests

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch or commit to test"
        required: false
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  # the runner restricts the user namespaces Chromium's sandbox needs
  QTWEBENGINE_DISABLE_SANDBOX: "1"

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries and packaging tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libegl1 libgl1 libgbm1 libnss3 \
              libxkbcommon0 libxkbcommon-x11-0 libxcomposite1 libxdamage1 libxrandr2 \
              libxtst6 libxshmfence1 libasound2t64 libfontconfig1 libdbus-1-3 \
              dbus libglib2.0-bin ffmpeg fonts-noto-core \
              pacman-package-manager libarchive-tools fakeroot zstd
          # the font of a Plasma desktop: the layout tests measure text widths
          mkdir -p ~/.config/fontconfig
          printf '%s\n' '<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig>' \
              '<alias binding="strong"><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>' \
              '</fontconfig>' > ~/.config/fontconfig/fonts.conf
          fc-cache -f >/dev/null
          fc-match sans-serif
      - name: Python packages
        run: |
          python -m pip install --disable-pip-version-check -q -r tools/test-requirements.txt pytest ruff
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ike-adblock/target
          key: adblock-${{ hashFiles('ike-adblock/Cargo.lock', 'ike-adblock/src/**') }}
      - name: AdBlock engine
        run: |
          cargo build --release --locked --manifest-path ike-adblock/Cargo.toml
          install -m755 ike-adblock/target/release/libike_adblock.so vendor/adblock/ike_adblock.abi3.so
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest
      - name: Arch package
        run: |
          mkdir -p "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/pkgroot"
          PKGDEST="$RUNNER_TEMP/pkg" PKGEXT=.pkg.tar.zst makepkg -d -f
          pkg=$(find "$RUNNER_TEMP/pkg" -name 'ike-browser-*-x86_64.pkg.tar.zst' -print -quit)
          test -n "$pkg"
          tar -xf "$pkg" -C "$RUNNER_TEMP/pkgroot"
          if find "$RUNNER_TEMP/pkgroot" -type f \( -name '*.key' -o -name '*.pem' \) | grep -q .; then
            echo "Private-key-like file found in the package"; exit 1
          fi
          python3 "$RUNNER_TEMP/pkgroot/usr/lib/ike-browser/ike_boot.py" --version
      - name: Tests of the installed package
        run: IKE_TEST_APP="$RUNNER_TEMP/pkgroot/usr/lib/ike-browser" python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: ike-browser-package
          path: ${{ runner.temp }}/pkg/ike-browser-*-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30
