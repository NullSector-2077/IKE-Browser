# I.K.E. on Arch Linux's own packages: Python, Qt, PyQt and Qt WebEngine from
# Arch (the "Tests" workflow uses PyPI's Qt, which proves nothing about the
# engine the users really get). In an archlinux:latest container: the AdBlock
# engine built, the whole test suite, then the package built with makepkg,
# installed with pacman and tested as installed.
#
# Taken from the archived branch linux/distro-checks (Arch job only, 2026-11-20,
# Arch-first). It is the compatibility check of the system components: pacman
# updates them on the users' computers outside I.K.E.'s releases. It records
# the versions it really tested (artifact "arch-versions", read back by the
# daily component check: tools/check-components.py --arch) and runs:
# - on every push to main, and when the automation changed main or its fix
#   branch (a dispatch: tools/automerge.py, autofix.yml);
# - on the daily maintenance candidate (daily-maintenance.yml) and on every
#   branch of the automation before its merge (tools/automerge.py: the
#   verified merge of 2026-11-22 needs it);
# - when Arch's packages changed since the last green run on main (a dispatch
#   from daily-check.yml);
# - once a week as a floor, on pull requests that touch the package or this
#   file, and by hand.
# Since the full chain (2026-11-22, WP10): it records the FULL dependency closure
# it installed (pacman -Qi, recursively: Mesa, ffmpeg, NSS, ICU, the fonts...),
# and the daily check starts it on main when any of those packages changed in
# Arch; it installs the optional dependencies too, whose targeted tests
# (tests/test_optional_deps.py) run where they are present and say "not
# verified" where they are not. Once a week arch-testing.yml calls it with
# Arch's [core-testing] and [extra-testing] (input testing).
# A failure goes to the automatic fix (tools/autofix-plan.py, "Arch Linux"):
# pacman, mirrors, keyring or downloads are GitHub's or Arch's matter (an
# issue, no AI); a build or test failure is fixed only when "Tests" passed on
# the same commit (an incompatibility with Arch alone). Not a required check
# of the release.
name: Arch Linux

on:
  pull_request:
    branches: [main]
    paths: [PKGBUILD, .github/workflows/arch.yml]
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"     # Mondays, 03:41 UTC
  workflow_dispatch:
  # WP10 (b): arch-testing.yml, once a week, with Arch's testing repositories
  workflow_call:
    inputs:
      testing:
        description: "Arch's [core-testing] and [extra-testing] on"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# the testing run (arch-testing.yml calls this file) has a queue of its own
concurrency:
  group: arch-${{ github.ref }}${{ inputs.testing && '-testing' || '' }}
  cancel-in-progress: true

jobs:
  arch:
    name: Arch Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: archlinux:latest
      # Chromium's sandbox needs user namespaces that a container on the
      # runner does not get; the package keeps the sandbox on (see About).
      env:
        QTWEBENGINE_DISABLE_SANDBOX: "1"
        LANG: C.UTF-8
    defaults:
      run:
        shell: bash
    steps:
      # WP10 (b): the packages Arch is about to ship, before they reach users
      - name: Arch's testing repositories (arch-testing.yml only)
        if: inputs.testing
        run: |
          # the testing repositories come before core and extra, as Arch's own pacman.conf says
          printf '[core-testing]\nInclude = /etc/pacman.d/mirrorlist\n\n[extra-testing]\nInclude = /etc/pacman.d/mirrorlist\n\n' > /tmp/testing.conf
          awk '/^\[core\]$/ && !done { while ((getline line < "/tmp/testing.conf") > 0) print line; done = 1 } { print }' \
              /etc/pacman.conf > /tmp/pacman.conf.new
          cp /tmp/pacman.conf.new /etc/pacman.conf
          grep -n '^\[' /etc/pacman.conf
      - name: Git (for the checkout)
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Git owner check
        # the checkout belongs to another user than the container's root (and
        # later to the package builder): git refuses it, and the tests use git ls-files
        run: git config --global --add safe.directory '*'
      - name: Arch's packages
        # the package's depends, makedepends and optdepends, plus what the tests use
        # (breeze, oxygen, kvantum: the widget styles of Arch's desktops besides
        # Qt's own, plasma-integration: KDE's own theme with its colours; the
        # interface is measured in each, 1.1.22). The other desktops I.K.E.
        # follows (tests/desktops.py): gtk3 for Qt's GTK theme (GNOME, Xfce,
        # MATE, Cinnamon) on an Xvfb display, lxqt-qtplugin for LXQt's, and
        # their icons: Adwaita (GNOME), elementary (Xfce), MATE's, Papirus
        # (Cinnamon, and common with KDE)
        run: |
          pacman -S --noconfirm --needed \
              python python-pyqt6 python-pyqt6-webengine qt6-webengine qt6-webchannel qt6-svg \
              python-cryptography python-jeepney publicsuffix-list python-pytest \
              base-devel rust sudo nodejs \
              ffmpeg dbus glib2 noto-fonts ttf-dejavu libnotify \
              noto-fonts-cjk intel-media-driver libva-nvidia-driver \
              breeze oxygen kvantum plasma-integration breeze-icons \
              gtk3 xorg-server-xvfb lxqt-qtplugin \
              adwaita-icon-theme elementary-icon-theme mate-icon-theme papirus-icon-theme
      # What this run really tests: pacman's versions of the components I.K.E.
      # follows (tools/check-components.py, ARCH_PACKAGES), Python, Qt, PyQt and
      # the engine's Chromium as I.K.E. reports it. Never fails the run.
      - name: The versions tested
        run: |
          mkdir -p out
          python3 tools/check-components.py --record-arch out/arch-versions.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-versions
          path: out/arch-versions.json
          if-no-files-found: error
          retention-days: 90
      # downloaded apart from the build: a crate that cannot be downloaded is
      # crates.io's or the network's matter, not the code's (autofix-plan.py)
      - name: AdBlock engine's crates
        run: cargo fetch --locked --manifest-path ike-adblock/Cargo.toml
      - name: AdBlock engine
        run: |
          cargo build --release --frozen --manifest-path ike-adblock/Cargo.toml
          install -m755 ike-adblock/target/release/libike_adblock.so vendor/adblock/ike_adblock.abi3.so
      - name: Engine versions
        run: |
          python3 -c "from PyQt6.QtCore import QT_VERSION_STR, PYQT_VERSION_STR; \
          from PyQt6.QtWebEngineCore import qWebEngineChromiumVersion as c; \
          print('Qt', QT_VERSION_STR, '- PyQt', PYQT_VERSION_STR, '- Chromium', c())" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tests (Arch's Qt)
        run: |
          set -o pipefail
          python3 -m pytest -ra --junitxml=out/tests-arch.xml 2>&1 | tee out/tests-arch.log
      # The interface in the widget styles of Arch's desktops (1.1.22): every
      # text, switch and the tab preview in each language, as the owner's KDE
      # (Breeze) and the others draw them; the run above used Qt's Fusion.
      # The icons and colours of every desktop I.K.E. follows (KDE, Papirus,
      # GNOME, Xfce, MATE, Cinnamon, LXQt, light and dark, and Qt alone) are
      # measured in the run above, each desktop a case of tests/test_icons.py
      # and tests/test_desktop_colours.py; here every text once more with
      # GNOME's own font (Adwaita Sans 11) and KDE's Breeze Dark.
      - name: Interface in every widget style
        run: |
          set -o pipefail
          for style in Breeze Oxygen kvantum Windows; do
            echo "== $style"
            QT_STYLE_OVERRIDE=$style python3 -m pytest -ra -q -p no:cacheprovider \
                tests/test_text_fit.py tests/test_tabpreview.py 2>&1 | tee -a out/styles.log
          done
          echo "== GNOME's theme (GTK: Adwaita, Adwaita Sans 11)"
          IKE_TEST_DESKTOP=gnome python3 -m pytest -ra -q -p no:cacheprovider \
              tests/test_text_fit.py tests/test_switches.py tests/test_tabpreview.py 2>&1 | tee -a out/styles.log
          # I.K.E. following the system on KDE Plasma: KDE's theme, Breeze Dark colours
          cp /usr/share/color-schemes/BreezeDark.colors /etc/xdg/kdeglobals
          printf '\n[General]\nColorScheme=BreezeDark\n\n[KDE]\nwidgetStyle=Breeze\n\n[Icons]\nTheme=breeze-dark\n' >> /etc/xdg/kdeglobals
          echo "== KDE Plasma's theme (Breeze Dark)"
          QT_QPA_PLATFORMTHEME=kde python3 -m pytest -ra -q -p no:cacheprovider \
              tests/test_text_fit.py tests/test_switches.py tests/test_tabpreview.py \
              tests/test_icons.py::test_every_icon_is_kdes_own_on_kde \
              "tests/test_menu_looks.py::test_menu_texts_share_one_left_edge[Breeze-it]" \
              "tests/test_menu_looks.py::test_menu_texts_share_one_left_edge[Breeze-en]" \
              "tests/test_desktop_colours.py::test_windows_take_the_desktops_colours[kde]" \
              2>&1 | tee -a out/styles.log
          rm -f /etc/xdg/kdeglobals
      - name: Arch package (makepkg, pacman)
        run: |
          useradd -m builder
          chown -R builder: .
          sudo -u builder env PKGDEST="$PWD/out" PKGEXT=.pkg.tar.zst makepkg -f --noconfirm
          pkg=$(find out -name 'ike-browser-*-x86_64.pkg.tar.zst' -print -quit)
          test -n "$pkg"
          if bsdtar -tf "$pkg" | grep -E '\.(key|pem)$'; then
            echo "Private-key-like file found in the package"; exit 1
          fi
          pacman -U --noconfirm "$pkg"
          ike-browser --version
      - name: Tests of the installed package (Arch)
        run: |
          set -o pipefail
          IKE_TEST_APP=/usr/lib/ike-browser python3 -m pytest -ra \
              --junitxml=out/tests-arch-installed.xml 2>&1 | tee out/tests-arch-installed.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: arch
          path: out/
          if-no-files-found: warn
          retention-days: 30

  # Runs the automation started with its own token (the daily check on main,
  # a merge made by itself, the automatic fix's branch) send no "workflow_run":
  # their failure is handed over here, as tests.yml does. Also a run the
  # automatic fix started again (a test that failed once runs once more).
  hand-over:
    needs: arch
    if: >-
      failure() && (
      (github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' &&
      (github.ref_name == 'main' || github.ref_name == 'automation/autofix-main' ||
      github.ref_name == 'automation/daily-maintenance' ||
      startsWith(github.ref_name, 'automation/update/') || startsWith(github.ref_name, 'automation/builder/'))) ||
      (github.run_attempt > 1 && github.triggering_actor == 'github-actions[bot]' &&
      (github.ref_name == 'main' || github.ref_name == 'automation/autofix-main' ||
      github.ref_name == 'automation/daily-maintenance' ||
      startsWith(github.ref_name, 'automation/update/') || startsWith(github.ref_name, 'automation/builder/'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Hand the failure to the automatic fix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for pause in 15 30 0; do
            if gh workflow run autofix.yml --ref main -f run_id="$RUN_ID"; then exit 0; fi
            sleep "$pause"
          done
          exit 1

  # Arch Linux passed on a branch of the automation (a run its token started
  # sends no "workflow_run"): the merge is asked for with a dispatch, as the
  # Tests and Security runs there do. Since 2026-11-22 (the verified merge) it
  # runs on the daily maintenance candidate and on every fix or update too
  # (daily-maintenance.yml, tools/automerge.py): tools/automerge.py needs
  # "Arch Linux" with every other check of the commit, "tests" and "sandbox"
  # included, and every category its components need.
  merge-ready:
    needs: arch
    if: >-
      success() && github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' &&
      (github.ref_name == 'automation/autofix-main' || github.ref_name == 'automation/daily-maintenance' ||
      startsWith(github.ref_name, 'automation/update/') || startsWith(github.ref_name, 'automation/builder/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Ask for the merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for pause in 15 30 0; do
            gh workflow run automerge.yml --ref main -f sha="$SHA" && exit 0
            sleep "$pause"
          done
          exit 1
