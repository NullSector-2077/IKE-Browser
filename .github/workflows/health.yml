# Every week: keep the scheduled workflows turned on (GitHub turns them off in
# a public repository after 60 days without activity) and open the issue
# "Automation health" when something stopped working (tools/automation-health.py).
name: Automation health

on:
  schedule:
    - cron: "41 7 * * 1"     # Mondays, 07:41 UTC
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write        # turn the scheduled workflows on again
      contents: read        # also the protection of main
      issues: write
      pull-requests: read   # maintenance pull requests waiting too long
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep the scheduled workflows turned on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # every workflow that runs on a schedule, found in the files (a new
          # one is never forgotten: arch.yml and security.yml were)
          for f in .github/workflows/*.yml; do
            if grep -q '^  schedule:' "$f"; then
              gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$(basename "$f")/enable"
            fi
          done
      # 1.1.19: one tiny question to each reserve of the automatic fix that has a
      # key (tools/autofix-reserve.py ping): a refused key or a model that is
      # gone is reported now, not when a failure needs it. The keys are in this
      # step only; the file holds provider, model and result, nothing else.
      - name: The reserves answer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AUTOFIX_GROQ_MODELS: ${{ vars.AUTOFIX_GROQ_MODELS }}
          AUTOFIX_ZAI_MODELS: ${{ vars.AUTOFIX_ZAI_MODELS }}
          AUTOFIX_OPENROUTER_MODELS: ${{ vars.AUTOFIX_OPENROUTER_MODELS }}
        run: python3 -I tools/autofix-reserve.py ping "$RUNNER_TEMP/reserve-ping.json" || echo "[]" > "$RUNNER_TEMP/reserve-ping.json"
      - name: Check the automation
        env:
          RESERVE_PING: ${{ runner.temp }}/reserve-ping.json
          GH_TOKEN: ${{ github.token }}
          # whether the secrets are set, never their values
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_GROQ_KEY: ${{ secrets.GROQ_API_KEY != '' }}
          HAS_ZAI_KEY: ${{ secrets.ZAI_API_KEY != '' }}
          HAS_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: python3 -I tools/automation-health.py
