# Every week: keep the scheduled workflows turned on (GitHub turns them off in
# a public repository after 60 days without activity) and open the issue
# "Automation health" when something stopped working (tools/automation-health.py).
name: Automation health

on:
  schedule:
    - cron: "41 7 * * 1"     # Mondays, 07:41 UTC
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write        # turn the scheduled workflows on again
      contents: read        # also the protection of main
      issues: write
      pull-requests: read   # maintenance pull requests waiting too long
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep the scheduled workflows turned on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # every workflow that runs on a schedule, found in the files (a new
          # one is never forgotten: arch.yml and security.yml were)
          for f in .github/workflows/*.yml; do
            if grep -q '^  schedule:' "$f"; then
              gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$(basename "$f")/enable"
            fi
          done
      # 1.1.19: one tiny question to each reserve of the automatic fix that has a
      # key (tools/autofix-reserve.py ping): a refused key or a model that is
      # gone is reported now, not when a failure needs it. The keys are in this
      # step only; the file holds provider, model and result, nothing else.
      - name: The reserves answer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AUTOFIX_GROQ_MODELS: ${{ vars.AUTOFIX_GROQ_MODELS }}
          AUTOFIX_ZAI_MODELS: ${{ vars.AUTOFIX_ZAI_MODELS }}
          AUTOFIX_OPENROUTER_MODELS: ${{ vars.AUTOFIX_OPENROUTER_MODELS }}
        run: python3 -I tools/autofix-reserve.py ping "$RUNNER_TEMP/reserve-ping.json" || echo "[]" > "$RUNNER_TEMP/reserve-ping.json"
      # WP9 (2026-11-22): every configured provider, Gemini included, answers one
      # tiny request and is free: OpenRouter only ":free" models priced zero by
      # OpenRouter itself and a key on the free tier; an answer with a cost, a
      # paid tier or a billing error marks the provider unavailable (the
      # automatic fix then skips it, autofix.yml's plan reads the artifact) and
      # the issue below tells the owner. The keys are in this step only; the
      # file holds provider, model, state and a reason, never a key.
      - name: The AI providers answer and are free
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AUTOFIX_MODEL: ${{ vars.AUTOFIX_MODEL }}
          AUTOFIX_GROQ_MODELS: ${{ vars.AUTOFIX_GROQ_MODELS }}
          AUTOFIX_ZAI_MODELS: ${{ vars.AUTOFIX_ZAI_MODELS }}
          AUTOFIX_OPENROUTER_MODELS: ${{ vars.AUTOFIX_OPENROUTER_MODELS }}
        run: |
          mkdir -p "$RUNNER_TEMP/providers"
          # a check that stops is reported by the next step ("Could not check ..."), never hides the rest
          if python3 -I tools/provider-check.py check "$RUNNER_TEMP/providers/ai-providers.json" \
              --markdown "$RUNNER_TEMP/providers/ai-providers.md" > /dev/null; then
            cat "$RUNNER_TEMP/providers/ai-providers.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the check of the AI providers stopped"
            rm -f "$RUNNER_TEMP/providers/ai-providers.json"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-providers
          path: ${{ runner.temp }}/providers/ai-providers.json
          if-no-files-found: ignore
          retention-days: 90
      # AUTOMAT block 2: when the owner's IKE_WORKFLOW_TOKEN expires (GitHub's header
      # GitHub-Authentication-Token-Expiration), or whether GitHub refuses it. The token is in this step
      # only; the file holds the HTTP code and the expiry date, never the token
      - name: When the owner's workflow token expires
        env:
          WORKFLOW_TOKEN: ${{ secrets.IKE_WORKFLOW_TOKEN }}
        run: |
          out="$RUNNER_TEMP/workflow-token.json"
          if [ -z "$WORKFLOW_TOKEN" ]; then echo '{"unset": true}' > "$out"; exit 0; fi
          headers="$RUNNER_TEMP/token-headers.txt"
          code=$(curl -s -o /dev/null -D "$headers" -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $WORKFLOW_TOKEN" https://api.github.com/rate_limit || true)
          expires=$(grep -i '^github-authentication-token-expiration:' "$headers" | head -n 1 | cut -d: -f2- \
            | tr -d '\r' | sed 's/^ *//' || true)
          rm -f "$headers"
          CODE="$code" EXPIRES="$expires" python3 -I -c 'import json, os, re
          code = os.environ["CODE"] if re.fullmatch(r"\d{3}", os.environ["CODE"]) else ""
          expires = re.sub(r"[^0-9A-Za-z :+-]", "", os.environ["EXPIRES"])[:40]
          print(json.dumps({"status": code, "expires": expires}))' > "$out"
      - name: Check the automation
        env:
          TOKEN_CHECK: ${{ runner.temp }}/workflow-token.json
          PROVIDER_CHECK: ${{ runner.temp }}/providers/ai-providers.json
          RESERVE_PING: ${{ runner.temp }}/reserve-ping.json
          GH_TOKEN: ${{ github.token }}
          # whether the secrets are set, never their values
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_GROQ_KEY: ${{ secrets.GROQ_API_KEY != '' }}
          HAS_ZAI_KEY: ${{ secrets.ZAI_API_KEY != '' }}
          HAS_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: python3 -I tools/automation-health.py
