# When the tests, the daily component check or the daily maintenance fail on
# the automation's own branches, prepare a fix and hand it to the owner as a
# draft pull request. Never on main, never a merge, never a release.
#
#   plan     (no AI)   what failed, where the fix goes, the end of the logs
#   fix      (AI)      the Antigravity agent, with no GitHub credentials: it
#                      can only leave a patch and a summary
#   guard    (no AI)   tools/check-autofix-patch.py from main accepts or
#                      refuses the patch; lint; the version for a fix of main
#   publish  (no AI)   pushes the fix to its automation branch, opens or
#                      updates the draft pull request and starts the tests
#   report   (no AI)   when nothing could be fixed: one issue "Automatic fix
#                      needs you: <workflow>" for the owner
#
# At most two automatic fixes for one failure (tools/autofix-plan.py). Needs the
# repository secret GEMINI_API_KEY; the repository variable AUTOFIX_MODEL may
# choose the model (empty: the CLI's default). See docs/MAINTENANCE.md.
name: Automatic fix

on:
  workflow_run:
    workflows: ["Tests", "Daily maintenance candidate", "Daily component check"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the failed run to fix"
        required: true

permissions: {}

concurrency:
  group: autofix
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      reason: ${{ steps.plan.outputs.reason }}
      kind: ${{ steps.plan.outputs.kind }}
      checkout: ${{ steps.plan.outputs.checkout }}
      push_branch: ${{ steps.plan.outputs.push_branch }}
      attempt: ${{ steps.plan.outputs.attempt }}
      allow_adblock: ${{ steps.plan.outputs.allow_adblock }}
      workflow: ${{ steps.plan.outputs.workflow }}
    steps:
      - name: Check out main (all branches, no credentials)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/failure"
          python3 -I tools/autofix-plan.py --run-id "$RUN_ID" --logs "$RUNNER_TEMP/failure/failure.md"
      - name: Keep the failure description
        if: steps.plan.outputs.action == 'fix'
        uses: actions/upload-artifact@v4
        with:
          name: autofix-failure
          path: ${{ runner.temp }}/failure/failure.md
          if-no-files-found: error
          retention-days: 7

  fix:
    needs: plan
    if: needs.plan.outputs.action == 'fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      patch: ${{ steps.agent.outputs.patch }}
      result: ${{ steps.agent.outputs.result }}
    steps:
      - name: Check out the commit to fix (no credentials)
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - name: Instructions and the agent's runner from main, never from the branch being fixed
        run: |
          git show origin/main:.github/autofix/prompt.md > "$RUNNER_TEMP/prompt.md"
          git show origin/main:tools/autofix-agent.py > "$RUNNER_TEMP/autofix-agent.py"
      - name: Failure description
        uses: actions/download-artifact@v4
        with:
          name: autofix-failure
          path: .autofix
      # The agent gets a user of its own ("agent"), a copy of the repository and:
      # - no terminal, no web, no MCP: its own permission rules deny them;
      # - outbound network only to the Gemini API: the firewall drops the rest;
      # - only HOME, PATH and GEMINI_API_KEY in its environment (no runner tokens).
      # No test environment: GitHub runs all the tests on its fix.
      - name: A closed room for the agent
        run: |
          group="$(id -gn)"
          sudo useradd --create-home --gid "$group" --shell /bin/sh agent
          sudo install -d -o "$(id -un)" -g "$group" -m 2775 /srv/autofix
          cp -a "$GITHUB_WORKSPACE" /srv/autofix/repo
          chmod -R g+rwX /srv/autofix/repo
          # Antigravity CLI for the agent user (the installer checks the SHA-512
          # of the download against Google's manifest)
          curl -fsSL https://antigravity.google/cli/install.sh -o /tmp/agy-install.sh
          chmod 644 /tmp/agy-install.sh
          sudo -u agent -H bash /tmp/agy-install.sh
          sudo -u agent -H mkdir -p /home/agent/.gemini/antigravity-cli
          printf '%s\n' '{ "modelProvider": "gemini",' \
            '  "permissions": { "deny": ["command(*)", "unsandboxed(*)", "read_url(*)",' \
            '                            "execute_url(*)", "mcp(*)"] } }' \
            | sudo -u agent tee /home/agent/.gemini/antigravity-cli/settings.json > /dev/null
          sudo tee /home/agent/run-agent.sh > /dev/null <<'SH'
          #!/bin/sh
          exec env -i HOME=/home/agent PATH=/home/agent/.local/bin:/usr/bin:/bin \
            GEMINI_API_KEY="$GEMINI_API_KEY" /home/agent/.local/bin/agy "$@"
          SH
          sudo chmod 755 /home/agent/run-agent.sh
          # the Gemini API only: its addresses, pinned for the whole run
          api=generativelanguage.googleapis.com
          ips=$(for _ in 1 2 3; do getent ahostsv4 "$api"; done | awk '{print $1}' | sort -u)
          test -n "$ips"
          echo "$(echo "$ips" | head -n1) $api" | sudo tee -a /etc/hosts > /dev/null
          sudo iptables -N AGENT
          sudo iptables -A AGENT -o lo -j ACCEPT
          for ip in $ips; do sudo iptables -A AGENT -p tcp -d "$ip" --dport 443 -j ACCEPT; done
          sudo iptables -A AGENT -j REJECT
          sudo iptables -I OUTPUT 1 -m owner --uid-owner agent -j AGENT
          sudo ip6tables -N AGENT
          sudo ip6tables -A AGENT -o lo -j ACCEPT
          sudo ip6tables -A AGENT -j REJECT
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner agent -j AGENT
          # the room is closed: the agent cannot reach anything else
          if sudo -u agent curl -s -m 5 -o /dev/null https://github.com; then
            echo "::error::the firewall does not hold"; exit 1
          fi
      - name: Agent, then the patch
        id: agent
        timeout-minutes: 32
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTOFIX_MODEL: ${{ vars.AUTOFIX_MODEL }}
        run: |
          out="$RUNNER_TEMP/autofix"
          repo=/srv/autofix/repo
          mkdir -p "$out"
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Il secret GEMINI_API_KEY non è impostato nel repository: l'agente non è partito." > "$out/summary.md"
            echo "patch=false" >> "$GITHUB_OUTPUT"
            echo "result=auth" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # model after model, at most 8 minutes each (tools/autofix-agent.py)
          python3 -I "$RUNNER_TEMP/autofix-agent.py" --workdir "$repo" --prompt "$RUNNER_TEMP/prompt.md" \
            --out "$out" --status "$out/status.json" \
            --agent-cmd "sudo -u agent --preserve-env=GEMINI_API_KEY /home/agent/run-agent.sh"
          result=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"])' "$out/status.json")
          echo "result=$result" >> "$GITHUB_OUTPUT"
          # .autofix/ is in .gitignore; reset it too, in case a branch lacks that line
          git -C "$repo" -c safe.directory='*' -c core.hooksPath=/dev/null -c core.fsmonitor=false add -A
          git -C "$repo" -c safe.directory='*' -c core.hooksPath=/dev/null -c core.fsmonitor=false reset -q -- .autofix
          git -C "$repo" -c safe.directory='*' -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            diff --cached --binary > "$out/autofix.patch"
          python3 -I - "$out" "$repo" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          out, repo = Path(sys.argv[1]), Path(sys.argv[2])
          key = os.environ["GEMINI_API_KEY"].encode()
          # never hand over the key, plain or encoded
          variants = {key, key[::-1]}
          for i in range(3):
              for enc in (base64.b64encode, base64.urlsafe_b64encode):
                  variants.add(enc(b"\0" * i + key)[4 if i else 0:-4])
          status = json.loads((out / "status.json").read_text("utf-8"))
          summary = repo / ".autofix" / "summary.md"
          text = summary.read_text("utf-8", errors="replace")[:4000] if summary.is_file() else \
              "L'agente non ha scritto un riassunto.\n"
          if status["result"] != "ok":
              text += "\n\n**%s** (modello: %s)\n\nUltime righe di errore dell'agente (chiave nascosta):\n\n```text\n%s\n```\n" % (
                  status["message"], status["model"], status["detail"].replace("```", "'''"))
          (out / "summary.md").write_text(text, "utf-8")
          for name in ("autofix.patch", "summary.md"):
              data = (out / name).read_bytes()
              if any(v and v in data for v in variants):
                  for f in out.glob("*"):
                      f.unlink()
                  (out / "summary.md").write_text("Risultato scartato: conteneva la chiave API. "
                                                  "Cambia la chiave GEMINI_API_KEY.\n", "utf-8")
                  print("::error::the agent's output contained the API key: discarded")
                  sys.exit(1)
          PY
          rm -f "$out"/agent-*.err
          if [ -s "$out/autofix.patch" ]; then echo "patch=true"; else echo "patch=false"; fi >> "$GITHUB_OUTPUT"
      - name: Keep the patch and the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofix-result
          path: |
            ${{ runner.temp }}/autofix/autofix.patch
            ${{ runner.temp }}/autofix/summary.md
          if-no-files-found: ignore
          retention-days: 14

  guard:
    needs: [plan, fix]
    if: needs.fix.outputs.patch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the same commit (no credentials)
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: autofix-result
          path: ${{ runner.temp }}/autofix
      - name: Checking tools from main, never from the branch being fixed
        run: |
          mkdir -p "$RUNNER_TEMP/trusted"
          for f in check-autofix-patch.py prepare-maintenance.py; do
            git show "origin/main:tools/$f" > "$RUNNER_TEMP/trusted/$f"
          done
      - name: Check and apply the patch
        env:
          ALLOW_ADBLOCK: ${{ needs.plan.outputs.allow_adblock }}
        run: |
          allow=""
          if [ "$ALLOW_ADBLOCK" = "true" ]; then allow="--allow-adblock"; fi
          python3 -I "$RUNNER_TEMP/trusted/check-autofix-patch.py" --repo . \
            --patch "$RUNNER_TEMP/autofix/autofix.patch" $allow --report "$RUNNER_TEMP/autofix/guard.md"
      - name: Lint
        run: |
          python3 -m pip install --disable-pip-version-check -q ruff
          ruff check .
      - name: A new version for users when a fix of main changes the browser
        if: needs.plan.outputs.kind == 'main'
        env:
          WORKFLOW: ${{ needs.plan.outputs.workflow }}
        run: |
          if git diff --cached --name-only | grep -q '^ike/' && [ -z "$(git diff origin/main -- CHANGELOG.md)" ]; then
            base_version=$(git show origin/main:ike/__init__.py | sed -n 's/^__version__ = "\(.*\)"/\1/p')
            keep=""
            if [ -z "$(git tag -l "v$base_version")" ]; then keep="--keep-version"; fi
            python3 -I "$RUNNER_TEMP/trusted/prepare-maintenance.py" --root . --base-version "$base_version" $keep \
              --bullet "- Automatic fix after a failure of \"$WORKFLOW\" (see its pull request)."
            git add -u
          fi
      - name: Commit and bundle
        env:
          ATTEMPT: ${{ needs.plan.outputs.attempt }}
          WORKFLOW: ${{ needs.plan.outputs.workflow }}
          CHECKOUT: ${{ needs.plan.outputs.checkout }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'autofix: attempt %s after a failure of "%s"\n\nPrepared by the Antigravity agent, accepted by tools/check-autofix-patch.py.\nRun: %s\n' \
            "$ATTEMPT" "$WORKFLOW" "$RUN_URL" > "$RUNNER_TEMP/message"
          git -c core.hooksPath=/dev/null commit -q -F "$RUNNER_TEMP/message"
          git bundle create "$RUNNER_TEMP/autofix/fix.bundle" "$CHECKOUT..HEAD"
      - name: Keep the accepted fix
        uses: actions/upload-artifact@v4
        with:
          name: autofix-accepted
          path: |
            ${{ runner.temp }}/autofix/fix.bundle
            ${{ runner.temp }}/autofix/guard.md
            ${{ runner.temp }}/autofix/summary.md
          if-no-files-found: error
          retention-days: 14
      - name: Keep the refusal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autofix-refused
          path: ${{ runner.temp }}/autofix/guard.md
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [plan, guard]
    if: needs.guard.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write        # start the tests on the fixed branch
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: autofix-accepted
          path: ${{ runner.temp }}/autofix
      - name: Push the fix, update the draft PR and start the tests
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.plan.outputs.kind }}
          PUSH_BRANCH: ${{ needs.plan.outputs.push_branch }}
          CHECKOUT: ${{ needs.plan.outputs.checkout }}
          WORKFLOW: ${{ needs.plan.outputs.workflow }}
          ATTEMPT: ${{ needs.plan.outputs.attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          b="$RUNNER_TEMP/autofix/fix.bundle"
          git bundle verify "$b"
          git fetch "$b" HEAD:refs/heads/autofix-result
          old=$(git rev-parse -q --verify "refs/remotes/origin/$PUSH_BRANCH" || true)
          if [ "$KIND" = "maintenance" ] || [ "$ATTEMPT" != "1" ]; then
            if [ "$old" != "$CHECKOUT" ]; then
              echo "::error::$PUSH_BRANCH has moved since the agent started: the fix is not pushed"
              exit 1
            fi
          fi
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push --force-with-lease="refs/heads/$PUSH_BRANCH:$old" origin "refs/heads/autofix-result:refs/heads/$PUSH_BRANCH"
          body="$RUNNER_TEMP/body.md"
          {
            echo "**Automatic fix, attempt $ATTEMPT** after a failure of \"$WORKFLOW\" ([run]($RUN_URL))."
            echo
            echo "Prepared by the Antigravity agent without any GitHub credential; accepted by the automatic checks."
            echo "The tests run again on this branch. **Review the changes before merging.**"
            echo
            echo "### Summary of the agent"
            echo
            cat "$RUNNER_TEMP/autofix/summary.md"
            echo
            echo "### Automatic checks"
            echo
            cat "$RUNNER_TEMP/autofix/guard.md"
          } > "$body"
          gh label create autofix --color d93f0b --description "Automatic fix prepared by the AI agent" 2>/dev/null || true
          pr=$(gh pr list --head "$PUSH_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body-file "$body"
            gh pr edit "$pr" --add-label autofix
          else
            gh pr create --draft --base main --head "$PUSH_BRANCH" --label autofix \
              --title "Automatic fix: \"$WORKFLOW\" failed" --body-file "$body"
          fi
          gh workflow run tests.yml --ref "$PUSH_BRANCH"

  report:
    needs: [plan, fix, guard, publish]
    if: >-
      always() && (needs.plan.outputs.action == 'issue' ||
      (needs.plan.outputs.action == 'fix' && needs.publish.result != 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: autofix-result
          path: ${{ runner.temp }}/autofix
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: autofix-refused
          path: ${{ runner.temp }}/autofix
      - name: Tell the owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ needs.plan.outputs.action }}
          REASON: ${{ needs.plan.outputs.reason }}
          WORKFLOW: ${{ needs.plan.outputs.workflow }}
          FIX: ${{ needs.fix.result }}
          PATCH: ${{ needs.fix.outputs.patch }}
          AGENT: ${{ needs.fix.outputs.result }}
          GUARD: ${{ needs.guard.result }}
          PUBLISH: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # in plain Italian: quota / chiave / modello / tempo / rifiutata
          if [ "$ACTION" = "issue" ]; then why="$REASON"
          elif [ "$AGENT" = "quota" ]; then why="quota: la quota gratuita di oggi è finita su tutti i modelli (si riprova domani)"
          elif [ "$AGENT" = "auth" ]; then why="chiave: GEMINI_API_KEY manca, non è valida o non ha i permessi"
          elif [ "$AGENT" = "config" ]; then why="modello: il nome del modello (AUTOFIX_MODEL) o la configurazione non sono validi"
          elif [ "$AGENT" = "timeout" ]; then why="tempo: l'agente ha superato il tempo massimo"
          elif [ "$AGENT" = "temporary" ]; then why="Google non rispondeva: riprova più tardi"
          elif [ "$FIX" != "success" ]; then why="il lavoro dell'agente si è interrotto (vedi il run)"
          elif [ "$PATCH" != "true" ]; then why="l'agente non ha cambiato niente (vedi il suo riassunto)"
          elif [ "$GUARD" != "success" ]; then why="rifiutata: i controlli automatici hanno respinto la modifica"
          else why="la correzione non è stata pubblicata (il ramo è cambiato o manca un permesso)"
          fi
          body="$RUNNER_TEMP/issue.md"
          {
            echo "**$WORKFLOW** failed and could not be fixed automatically: $why."
            echo
            echo "Servono le tue mani o le mie: apri una conversazione e incolla il link di questa issue."
            echo
            echo "Run: $RUN_URL"
            for f in summary.md guard.md; do
              if [ -s "$RUNNER_TEMP/autofix/$f" ]; then echo; cat "$RUNNER_TEMP/autofix/$f"; fi
            done
          } > "$body"
          title="Automatic fix needs you: $WORKFLOW"
          gh label create autofix --color d93f0b --description "Automatic fix prepared by the AI agent" 2>/dev/null || true
          open=$(gh issue list --label autofix --state open --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$body"
          else
            gh issue create --title "$title" --label autofix --body-file "$body"
          fi
