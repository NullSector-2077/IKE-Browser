# I.K.E. as a Flatpak (packaging/flatpak/README.md): built with
# flatpak-builder in Flathub's own container for the KDE 6.11 run time, then
# installed from the bundle and started inside the Flatpak sandbox: --version,
# the Python libraries and the AdBlock engine, the engine report (versions,
# formats declared and really decoded) with Chromium's sandbox on, where the
# H.264 / AAC decoders come from, and the test suite inside the sandbox
# against the installed copy. A failing step fails the job.
#
# The bundle is kept as a download of the run ONLY when it contains no
# H.264 / AAC decoder of its own (ROADMAP.md, "Codecs": I.K.E. never ships a
# proprietary codec). The step "Where the decoders come from" decides it.
#
# The Flatpak builds its own Qt WebEngine, decoding through the run time's
# FFmpeg (packaging/flatpak/README.md, "Codecs"). Chromium needs more than one
# GitHub job: the jobs engine-1 to engine-3 (flatpak-engine.yml) build it in
# parts and keep it in flatpak-builder's cache; once it is there, engine-1
# finds it in minutes and the other two are skipped.
name: Flatpak

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, linux/flatpak]
    # notes alone do not start a build of several hours
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

# a newer push waits instead of stopping a part of the engine build
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ID: io.github.nullsector_2077.IKE-Browser
  BUNDLE: ike-browser.flatpak
  MANIFEST: packaging/flatpak/io.github.nullsector_2077.IKE-Browser.yml
  # the same options as in flatpak-engine.yml, so the cached stages are found
  FB_OPTS: --disable-rofiles-fuse --install-deps-from=flathub --default-branch=master --arch=x86_64 --state-dir=.flatpak-builder --ccache
  XDG_RUNTIME_DIR: /tmp/xdg-runtime

jobs:
  engine-1:
    uses: ./.github/workflows/flatpak-engine.yml
    with:
      part: 1

  engine-2:
    needs: engine-1
    if: needs.engine-1.outputs.done != 'true'
    uses: ./.github/workflows/flatpak-engine.yml
    with:
      part: 2

  engine-3:
    needs: engine-2
    if: needs.engine-2.outputs.done != 'true'
    uses: ./.github/workflows/flatpak-engine.yml
    with:
      part: 3

  flatpak:
    name: Flatpak (KDE 6.11)
    needs: [engine-1, engine-2, engine-3]
    if: >-
      ${{ !cancelled() && needs.engine-1.result == 'success'
      && needs.engine-2.result != 'failure' && needs.engine-3.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      # bubblewrap, which flatpak-builder and flatpak run use, needs it
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Container
        run: tools/ci/flatpak-container.sh

      - name: flatpak-builder's cache (Qt WebEngine)
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder/cache
          key: flatpak-stages-none
          restore-keys: flatpak-stages-

      - name: Downloaded sources
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder/downloads
          key: flatpak-downloads-${{ hashFiles('packaging/flatpak/qtwebengine/qtwebengine.json') }}

      - name: Qt WebEngine from the cache
        run: |
          # minutes when the engine jobs left it in the cache; a stop here
          # instead of a build of many hours when they did not
          if ! timeout -k 2m 40m flatpak-builder $FB_OPTS --force-clean --stop-at=python3-build-deps \
              flatpak_app "$MANIFEST" > out/engine-from-cache.log 2>&1; then
            tail -n 30 out/engine-from-cache.log
            echo "::error::Qt WebEngine is not in flatpak-builder's cache: the engine jobs did not finish it"
            exit 1
          fi
          grep -E "Cache hit|Building module" out/engine-from-cache.log || true

      - name: Build the Flatpak and its bundle
        run: |
          flatpak-builder $FB_OPTS --force-clean --repo=repo \
              --subject="Built from $GITHUB_SHA" flatpak_app "$MANIFEST" 2>&1 | tee out/build.log \
              | grep -v -E '^\[[0-9]+/[0-9]+\] '
          flatpak build-bundle repo "$BUNDLE" "$APP_ID" master \
              --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -l "$BUNDLE"

      - name: Lint (Flathub's linter, for information)
        continue-on-error: true
        run: |
          if command -v flatpak-builder-lint >/dev/null; then
            flatpak-builder-lint manifest packaging/flatpak/io.github.nullsector_2077.IKE-Browser.yml || true
            flatpak-builder-lint repo repo || true
          else
            echo "flatpak-builder-lint is not in this image"
          fi
          appstreamcli validate --no-net --explain \
            packaging/flatpak/io.github.nullsector_2077.IKE-Browser.metainfo.xml || true
          desktop-file-validate flatpak_app/files/share/applications/$APP_ID.desktop || true

      - name: Install the bundle
        run: |
          ls -l "$BUNDLE"
          flatpak install --system -y --noninteractive "$BUNDLE"
          flatpak info --system "$APP_ID"
          flatpak info --system --show-permissions "$APP_ID" | tee out/permissions.txt

      - name: Start I.K.E. inside the Flatpak
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ike/__init__.py)
          got=$(flatpak run --env=QT_QPA_PLATFORM=offscreen "$APP_ID" --version)
          echo "$got"
          test "$got" = "I.K.E. $version"
          # the libraries of the PKGBUILD, the AdBlock engine, the updater
          # knowing that updates come from Flatpak, the desktop's name for it
          flatpak run --env=QT_QPA_PLATFORM=offscreen --command=python3 "$APP_ID" -c '
          import sys
          sys.path[:0] = ["/app/lib/ike-browser", "/app/lib/ike-browser/vendor"]
          import cryptography, jeepney, adblock
          from ike import osinfo
          print("cryptography", cryptography.__version__, "| jeepney", jeepney.__version__)
          print("AdBlock engine:", adblock.BACKEND)
          assert adblock.MODERN, "the I.K.E. AdBlock engine did not load"
          assert osinfo.in_flatpak(), "the Flatpak was not detected"
          assert osinfo.desktop_id() == "'"$APP_ID"'", osinfo.desktop_id()
          '
          flatpak run --command=sh "$APP_ID" -c '
            for t in notify-send xdg-open gdbus xdg-settings dbus-daemon; do printf "%s: " $t; command -v $t || echo "not in the run time"; done
            fc-match sans-serif'

      - name: Engine report inside the Flatpak, Chromium sandbox on
        run: |
          # as an ordinary user, with a session bus and Flatpak's portal
          # (tools/ci/flatpak-sandboxed.sh); the sandbox is NOT switched off
          tools/ci/flatpak-sandboxed.sh "$APP_ID" python3 tools/engine-report.py \
              --app /app/lib/ike-browser --decode tests/media \
              --json out/engine-flatpak.json --markdown out/engine-flatpak.md 2>&1 | tee out/engine-flatpak.log
          python3 - <<'EOF'
          import json
          r = json.load(open("out/engine-flatpak.json"))
          assert not r["sandbox_off_by_environment"], "the sandbox was switched off"
          assert r["decoded"].get("VP9"), "the sandboxed engine decoded nothing"
          # through the run time's FFmpeg, with its codec extension installed
          missing = [k for k in ("H.264", "AAC") if not r["decoded"].get(k)]
          assert not missing, "not decoded with the codec extension: %s" % missing
          EOF
          if grep -i -E "sandboxing disabled|no-sandbox|zygote_host.*not supported" out/engine-flatpak.log; then
            echo "Chromium's sandbox did not run"; exit 1
          fi
          { echo "### Flatpak (KDE 6.11), Chromium sandbox on"; cat out/engine-flatpak.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Where the H.264 / AAC decoders come from
        id: codecs
        run: |
          # 1. The bundle's own files: no FFmpeg decoder of H.264 / AAC / HEVC
          #    in any of them; the base application's engine as the control
          #    (it has them), so that the search is known to find them.
          files=/var/lib/flatpak/app/$APP_ID/current/active/files
          base=$(flatpak info --system --show-location com.riverbankcomputing.PyQt.BaseApp//6.11)/files
          set +e
          python3 tools/ci/flatpak-codecs.py "$files" "$base" | tee out/codecs.md
          clean=${PIPESTATUS[0]}
          set -e
          cat out/codecs.md >> "$GITHUB_STEP_SUMMARY"
          # 2. Where the engine's FFmpeg comes from inside the sandbox
          flatpak run --command=sh "$APP_ID" -c \
            'ldd /app/lib/libQt6WebEngineCore.so.6 | grep -E "libav|openh264"' | tee -a out/codecs.md
          # 3. For information: what plays without the codec extension (only
          #    the run time itself). Chromium's sandbox off for this
          #    diagnostic start only; the sandboxed start is the step before.
          flatpak list --runtime --columns=ref | grep -i -E "codecs|openh264" || true
          # Help -> About's check of the extension (ike/mediacheck.py), in
          # the real sandbox: "missing" now, "installed" after the reinstall
          missing='import sys; sys.path.insert(0, "/app/lib/ike-browser"); from ike import mediacheck; print(mediacheck.codecs_extra_missing())'
          test "$(flatpak run --command=python3 "$APP_ID" -c "$missing")" = False
          flatpak uninstall --system -y --noninteractive org.freedesktop.Platform.codecs-extra//25.08-extra
          test "$(flatpak run --command=python3 "$APP_ID" -c "$missing")" = True
          flatpak run --filesystem="$PWD" --env=QT_QPA_PLATFORM=offscreen --env=QTWEBENGINE_DISABLE_SANDBOX=1 \
              --command=python3 "$APP_ID" "$PWD/tools/engine-report.py" --app /app/lib/ike-browser \
              --decode "$PWD/tests/media" --json "$PWD/out/engine-flatpak-no-codecs-extra.json" >/dev/null 2>&1 || true
          flatpak install --system -y --noninteractive flathub org.freedesktop.Platform.codecs-extra//25.08-extra
          test "$(flatpak run --command=python3 "$APP_ID" -c "$missing")" = False
          echo "Help -> About's check of the codec extension: right with and without it" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("out/engine-flatpak-no-codecs-extra.json"))["decoded"]
          print("Decoded without the run time's codec extension (the run time's own FFmpeg / OpenH264): %s\n"
                % (", ".join(k for k, v in d.items() if v) or "nothing"))
          EOF
          # the verdict is the job's last step, so that the tests still run
          echo "clean=$([ "$clean" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Keep the bundle (only without a proprietary decoder)
        if: steps.codecs.outputs.clean == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ike-browser-flatpak
          path: ${{ env.BUNDLE }}
          if-no-files-found: error
          retention-days: 14

      - name: Tests inside the Flatpak (installed copy)
        run: |
          set -o pipefail
          # pytest is not part of the Flatpak: a copy for this step only,
          # given to the sandbox's Python through PYTHONPATH
          python3 -m pip install -q --root-user-action=ignore --target "$PWD/.ci/pytest" "pytest==9.1.1"
          # Noto Sans, the font of a Plasma desktop, as on the other
          # distributions: the layout tests measure text widths. The KDE run
          # time has DejaVu Sans only (on a desktop the Flatpak sees the
          # system's fonts): Noto Sans from Google's font repository.
          mkdir -p "$PWD/.ci/fonts"
          curl -sSfL -o "$PWD/.ci/fonts/NotoSans.ttf" \
            "https://github.com/google/fonts/raw/main/ofl/notosans/NotoSans%5Bwdth,wght%5D.ttf"
          sha256sum "$PWD/.ci/fonts/NotoSans.ttf"
          printf '%s\n' '<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig>' \
            '<include ignore_missing="yes">/etc/fonts/fonts.conf</include>' \
            "<dir>$PWD/.ci/fonts</dir>" \
            '<alias binding="strong"><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>' \
            '</fontconfig>' > "$PWD/.ci/fonts.conf"
          # test_plasma.py starts a private session bus with dbus-daemon,
          # which the run time does not have: the bus is started here,
          # outside the sandbox, on a socket in the shared checkout
          # (IKE_TEST_SESSION_BUS, tests/conftest.py)
          bus="$PWD/.ci/test-bus"
          rm -f "$bus"
          dbus-daemon --session --address="unix:path=$bus" --fork --print-pid=1 > .ci/test-bus.pid
          # the tests switch Chromium's sandbox off for the browsers they
          # start (tests/conftest.py), as in every other workflow; the
          # self-update tests skip themselves inside a Flatpak
          flatpak run --filesystem="$PWD" --env=PYTHONPATH="$PWD/.ci/pytest" \
              --env=FONTCONFIG_FILE="$PWD/.ci/fonts.conf" --env=IKE_TEST_SESSION_BUS="unix:path=$bus" \
              --env=IKE_TEST_APP=/app/lib/ike-browser --env=QT_QPA_PLATFORM=offscreen \
              --env=PYTHONDONTWRITEBYTECODE=1 --cwd="$PWD" --command=sh "$APP_ID" -c \
              'fc-match sans-serif; exec python3 -m pytest -ra -p no:cacheprovider --junitxml=out/tests-flatpak.xml' \
              2>&1 | tee out/tests-flatpak.log
          kill "$(cat .ci/test-bus.pid)" || true

      - name: No decoder of its own in the bundle
        if: steps.codecs.outputs.clean != 'true'
        run: |
          echo "::error::the bundle contains decoders of its own, or the search could not be verified (out/codecs.md)"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatpak-reports
          path: out/
          if-no-files-found: warn
          retention-days: 30
