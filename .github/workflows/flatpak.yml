# I.K.E. as a Flatpak (packaging/flatpak/README.md): built with
# flatpak-builder in Flathub's own container for the KDE 6.11 run time, then
# installed from the bundle and started inside the Flatpak sandbox: --version,
# the engine report (versions, formats declared and really decoded), the
# Python libraries and the AdBlock engine, and the test suite run inside the
# sandbox with the installed copy. A failing step fails the job.
name: Flatpak

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, linux/flatpak]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.nullsector_2077.IKE-Browser
  BUNDLE: ike-browser.flatpak

jobs:
  flatpak:
    name: Flatpak (KDE 6.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      # bubblewrap, which flatpak-builder and flatpak run use, needs it
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Container
        run: |
          df -h / "$PWD" || true
          nproc
          flatpak --version
          flatpak-builder --version
          flatpak remotes --show-details || true
          # The run times come preinstalled in the image's own layer, where
          # ostree cannot rename across the overlay ("Invalid cross-device
          # link" when flatpak-builder updates them): copied into the
          # container's writable layer first.
          mv /var/lib/flatpak /var/lib/flatpak.image
          cp -a /var/lib/flatpak.image /var/lib/flatpak
          rm -rf /var/lib/flatpak.image
          flatpak list --columns=ref

      - name: Build the Flatpak and its bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.nullsector_2077.IKE-Browser.yml
          bundle: ${{ env.BUNDLE }}
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/**') }}
          upload-artifact: false

      - name: Install the bundle
        run: |
          test -f "$BUNDLE"
          ls -l "$BUNDLE"
          flatpak install --system -y --noninteractive "$BUNDLE"
          flatpak info --system "$APP_ID"
          mkdir -p out
          flatpak info --system --show-permissions "$APP_ID" | tee out/permissions.txt

      - name: What the run time offers (codecs, tools)
        continue-on-error: true
        run: |
          set -x
          flatpak info -m org.kde.Platform//6.11 | sed -n '/Extension/,$p' | head -60
          flatpak remote-ls flathub --all 2>/dev/null | grep -i -E 'codecs|ffmpeg' | head -20
          flatpak run --command=sh "$APP_ID" -c '
            for t in notify-send xdg-settings xdg-open dbus-daemon gdbus; do printf "%s: " $t; command -v $t || echo missing; done
            ls -d /usr/lib/x86_64-linux-gnu/codecs* /usr/lib/extensions/* 2>&1
            ls /usr/lib/x86_64-linux-gnu | grep -E "^lib(avcodec|avformat|avutil|openh264)" '
          flatpak run --command=sh org.kde.Sdk//6.11 -c '
            pkg-config --modversion libavcodec libavformat libavutil opus libwebp
            printf "%s\n" "#include <libavformat/avformat.h>" "int main(void){AVStream s; return (int)av_stream_get_first_dts(&s);}" > /tmp/t.c
            gcc /tmp/t.c $(pkg-config --cflags --libs libavformat) -o /tmp/t && echo "FFmpeg has av_stream_get_first_dts (Chromium patch)" || echo "FFmpeg lacks av_stream_get_first_dts"
            ffmpeg -hide_banner -decoders 2>/dev/null | grep -i -E " (h264|aac|hevc|libopenh264)" '
          for v in 6.11.3 6.11.2; do
            u=https://download.qt.io/official_releases/qt/6.11/$v/submodules/qtwebengine-everywhere-src-$v.tar.xz
            curl -sSfL "$u" -o /tmp/qtwe.tar.xz && { echo "$u"; sha256sum /tmp/qtwe.tar.xz; ls -l /tmp/qtwe.tar.xz; }
            rm -f /tmp/qtwe.tar.xz
          done

      - name: Start I.K.E. inside the Flatpak
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ike/__init__.py)
          got=$(flatpak run --env=QT_QPA_PLATFORM=offscreen "$APP_ID" --version)
          echo "$got"
          test "$got" = "I.K.E. $version"
          # the libraries of the PKGBUILD, the AdBlock engine, and the updater
          # knowing that updates come from Flatpak
          flatpak run --env=QT_QPA_PLATFORM=offscreen --command=python3 "$APP_ID" -c '
          import sys
          sys.path[:0] = ["/app/lib/ike-browser", "/app/lib/ike-browser/vendor"]
          import cryptography, jeepney, adblock
          from ike import osinfo
          print("cryptography", cryptography.__version__, "| jeepney", jeepney.__version__)
          print("AdBlock engine:", adblock.BACKEND)
          assert adblock.MODERN, "the I.K.E. AdBlock engine did not load"
          assert osinfo.in_flatpak(), "the Flatpak was not detected"
          '

      - name: Engine report inside the Flatpak (Chromium sandbox on)
        id: sandboxed
        continue-on-error: true
        run: |
          # Chromium's sandbox inside Flatpak starts its processes through
          # the Flatpak portal on the session bus: a private bus and the
          # portal are started for this step.
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          portal=$(ls /usr/libexec/flatpak-portal /usr/lib/flatpak/flatpak-portal 2>/dev/null | head -1)
          echo "portal: ${portal:-none}"
          dbus-run-session -- bash -c "
            ${portal:-true} & sleep 2
            timeout 300 flatpak run --filesystem='$PWD' --env=QT_QPA_PLATFORM=offscreen \
              --command=python3 '$APP_ID' '$PWD/tools/engine-report.py' --app /app/lib/ike-browser \
              --decode '$PWD/tests/media' --json '$PWD/out/engine-flatpak-sandbox.json' \
              --markdown '$PWD/out/engine-flatpak-sandbox.md'"
          { echo "### Flatpak (KDE 6.11), Chromium sandbox on"; cat out/engine-flatpak-sandbox.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Engine report inside the Flatpak (sandbox off, this step only)
        if: steps.sandboxed.outcome != 'success'
        run: |
          # Only when the sandboxed start above failed in this container: the
          # report is still wanted. The manifest never switches it off.
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          flatpak run --filesystem="$PWD" --env=QT_QPA_PLATFORM=offscreen \
              --env=QTWEBENGINE_DISABLE_SANDBOX=1 --command=python3 "$APP_ID" \
              "$PWD/tools/engine-report.py" --app /app/lib/ike-browser --decode "$PWD/tests/media" \
              --json "$PWD/out/engine-flatpak.json" --markdown "$PWD/out/engine-flatpak.md"
          { echo "### Flatpak (KDE 6.11), sandbox off for this step"; cat out/engine-flatpak.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Tests inside the Flatpak (installed copy)
        run: |
          set -o pipefail
          # pytest is not part of the Flatpak: a copy for this step only,
          # given to the sandbox's Python through PYTHONPATH
          python3 -m pip --version || dnf -y -q install python3-pip
          python3 -m pip install -q --target "$PWD/.ci/pytest" "pytest==9.1.1"
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          # the tests switch Chromium's sandbox off for the browsers they
          # start (tests/conftest.py), as in every other workflow
          flatpak run --filesystem="$PWD" --env=PYTHONPATH="$PWD/.ci/pytest" \
              --env=IKE_TEST_APP=/app/lib/ike-browser --env=QT_QPA_PLATFORM=offscreen \
              --env=PYTHONDONTWRITEBYTECODE=1 --cwd="$PWD" --command=python3 "$APP_ID" \
              -m pytest -ra -p no:cacheprovider --junitxml="$PWD/out/tests-flatpak.xml" \
              2>&1 | tee out/tests-flatpak.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatpak-reports
          path: out/
          if-no-files-found: warn
          retention-days: 30
