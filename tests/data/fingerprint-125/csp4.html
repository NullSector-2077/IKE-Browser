<!doctype html><meta http-equiv="Content-Security-Policy" content="worker-src 'self'; script-src 'self' 'unsafe-inline'"><body><script>
var out = { violations: [] };
document.addEventListener('securitypolicyviolation', function (e) { out.violations.push([e.blockedURI, e.violatedDirective, e.sourceFile, e.lineNumber]); });
var w; try { w = new Worker('/rel-worker.js'); w.onmessage = function (e) { out.worker = e.data; done(); }; w.onerror = function (e) { out.worker = 'ERROR EVENT ' + e.message; done(); }; } catch (e) { out.worker = 'THROW ' + e; done(); }
function done() { setTimeout(function () { parent.postMessage({ csp: out }, '*'); }, 300); }
setTimeout(done, 5000);
</script></body>
